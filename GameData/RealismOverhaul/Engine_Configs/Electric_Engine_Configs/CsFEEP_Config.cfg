//	==================================================
//	Caesium FEEP (Field Emission Electric Propulsion) Thruster
//
//	Manufacturer: Alta S.p.A. (Centrospazio, Pisa) for ESA
//
//	=================================================================================
//	Cs-FEEP slit emitter
//	Liquid caesium is drawn out of a ~1 um slit by a strong electric field and ionised
//
//	Dry Mass: ??? Kg (0.5 Kg used as an estimate for one thruster with neutraliser)
//	Thrust (SL): ??? kN
//	Thrust (Vac): 0.1 - 150 uN (resolution < 0.1 uN). ~100 uN in endurance testing
//	Power: ~60 W/mN, ~6 W at 100 uN
//	ISP: ??? SL / 6000 - 11000 Vac (6000 used)
//	Burn Time: >3000 hr endurance tested, >800 N*s total impulse
//	Propellant: Caesium
//	Throttle: 0 - 100%
//	Ignitions: Infinite
//	=================================================================================

//	Sources:

//	https://www.esa.int/articles/esa-designs-its-smallest-ever-space-engine-to-push-back-against-sunshine
//	https://meetingorganizer.copernicus.org/EPSC2010/EPSC2010-784.pdf
//	https://s3vi.ndc.nasa.gov/ssri-kb/static/resources/Endurance_test_of_the_micronewton_FEEP_thruster.pdf
//	https://arxiv.org/pdf/0906.2901
//	https://en.wikipedia.org/wiki/Field-emission_electric_propulsion

//	Used by:
//	Baselined for LISA Pathfinder and MICROSCOPE drag-free control (both later flew cold gas). Never flown.

//	==================================================

@PART[*]:HAS[#engineType[CsFEEP]]:FOR[RealismOverhaulEngines]
{
	%title = #roCsFEEPTitle	//Caesium FEEP Thruster
	%manufacturer = #roMfrAlta
	%description = #roCsFEEPDesc

	@tags ^= :$: esa italy alta centrospazio feep field emission caesium cesium lisa microscope electric

	%specLevel = prototype

	@MODULE[ModuleEngines*]
	{
		%EngineType = Electric
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	!MODULE[ModuleGimbal],*{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = Cs-FEEP
		origMass = 0.0005
		CONFIG
		{
			name = Cs-FEEP
			description = 150 uN at ~9 W. Throttles smoothly to zero.
			specLevel = prototype
			minThrust = 0
			maxThrust = 0.00000015
			heatProduction = 0

			PROPELLANT
			{
				name = Caesium
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT	//~9 W
			{
				name = ElectricCharge
				ratio = 6813660
				DrawGauge = True
				minResToLeave = 10.0
			}
			atmosphereCurve
			{
				key = 0 6000
				key = 1 1
			}
			//never flown, >3000 hr ground endurance test
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedBurnTime = 10800000

				ignitionReliabilityStart = 0.98
				ignitionReliabilityEnd = 0.999
				cycleReliabilityStart = 0.98
				cycleReliabilityEnd = 0.999
			}
		}
	}
}
