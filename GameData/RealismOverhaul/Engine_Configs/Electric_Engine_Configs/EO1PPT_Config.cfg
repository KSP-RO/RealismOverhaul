//	==================================================
//	EO-1 Pulsed Plasma Thruster
//
//	Manufacturer: Primex Aerospace (now Aerojet), for NASA Glenn
//
//	=================================================================================
//	EO-1 PPT
//	Teflon (PTFE) ablative pulsed plasma thruster, used for pitch control on EO-1
//
//	Mass: 4.95 Kg total incl. 0.07 Kg PTFE per side (2 sides), 4.8 Kg dry
//	Thrust (SL): ??? kN
//	Thrust (Vac): 860 uN max (860 uN*s impulse bit at 1 Hz), 90 uN*s at 12 W
//	Power: 12 - 70 W (100 W design)
//	ISP: ??? SL / 650 - 1400 Vac
//	Total Impulse: ~460 N*s estimated
//	Propellant: PTFE (solid)
//	Throttle: by pulse energy / rate
//	Ignitions: Infinite
//	=================================================================================

//	Sources:

//	https://ntrs.nasa.gov/api/citations/20000121223/downloads/20000121223.pdf
//	https://ntrs.nasa.gov/api/citations/20030025690/downloads/20030025690.pdf
//	https://ntrs.nasa.gov/api/citations/20050176396/downloads/20050176396.pdf

//	Used by:
//	Earth Observing-1 (launched 21 November 2000)

//	==================================================

@PART[*]:HAS[#engineType[EO1PPT]]:FOR[RealismOverhaulEngines]
{
	%title = #roEO1PPTTitle	//EO-1 Pulsed Plasma Thruster
	%manufacturer = #roMfrPrimex
	%description = #roEO1PPTDesc

	@tags ^= :$: usa primex aerojet nasa glenn eo-1 eo1 ppt pulsed plasma teflon ptfe electric

	%specLevel = operational

	@MODULE[ModuleEngines*]
	{
		%EngineType = Electric
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	!MODULE[ModuleGimbal],*{}

	RESOURCE
	{
		name = PTFE
		amount = 0.0636	//0.14 kg
		maxAmount = 0.0636
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = EO-1-PPT
		origMass = 0.0048
		CONFIG
		{
			name = EO-1-PPT
			description = 70 W, 860 uN*s pulses at 1 Hz. Throttles down to ~12 W.
			specLevel = operational
			minThrust = 0
			maxThrust = 0.00000086
			heatProduction = 0

			PROPELLANT
			{
				name = PTFE
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT	//70 W
			{
				name = ElectricCharge
				ratio = 2458504
				DrawGauge = True
				minResToLeave = 10.0
			}
			atmosphereCurve
			{
				key = 0 1400
				key = 1 1
			}
			//propellant-limited
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedBurnTime = 600000

				ignitionReliabilityStart = 0.995
				ignitionReliabilityEnd = 0.9998
				cycleReliabilityStart = 0.995
				cycleReliabilityEnd = 0.9998
				techTransfer = LES-8-9-PPT:50
			}
		}
	}
}
