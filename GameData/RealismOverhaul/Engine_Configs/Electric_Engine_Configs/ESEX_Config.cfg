//	==================================================
//	ESEX 26 kW Ammonia Arcjet
//
//	Manufacturer: TRW / Primex Aerospace, for the USAF Phillips Laboratory (AFRL)
//
//	=================================================================================
//	ESEX (Electric Propulsion Space Experiment)
//	High-power ammonia arcjet
//
//	Dry Mass: ??? Kg (only the whole 438 kg experiment package incl. batteries is published;
//		15 kg used here as an estimate for thruster + gimbal + conditioning hardware)
//	Thrust (SL): ??? kN
//	Thrust (Vac): ~2 N nominal (~1.5 N measured on first firing)
//	Power: 26 kW
//	ISP: ??? SL / 815 Vac nominal, 786 +- 43 s measured on orbit
//	Burn Time: 8 firings of ~15 min on orbit (1999)
//	Propellant: Ammonia
//	Throttle: N/A
//	Ignitions: Infinite
//	=================================================================================

//	Sources:

//	https://apps.dtic.mil/sti/pdfs/ADA517682.pdf
//	https://apps.dtic.mil/sti/pdfs/ADA411891.pdf
//	https://engineering.purdue.edu/~propulsi/propulsion/rockets/satellites/arcjet.html
//	https://www.spacedaily.com/news/argos-99g.html
//	https://en.wikipedia.org/wiki/Arcjet_rocket

//	Used by:
//	ARGOS (P91-1), launched 23 February 1999

//	==================================================

@PART[*]:HAS[#engineType[ESEX]]:FOR[RealismOverhaulEngines]
{
	%title = #roESEXTitle	//ESEX 26 kW Arcjet
	%manufacturer = #roMfrTRW
	%description = #roESEXDesc

	@tags ^= :$: usa trw primex afrl usaf esex argos arcjet ammonia electric

	%specLevel = prototype

	@MODULE[ModuleEngines*]
	{
		%EngineType = Electric
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	!MODULE[ModuleGimbal],*{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = ESEX
		origMass = 0.015
		CONFIG
		{
			name = ESEX
			description = 26 kW ammonia arcjet. Thrust and Isp from the ARGOS flight (~30% efficiency).
			specLevel = prototype
			minThrust = 0.002
			maxThrust = 0.002
			heatProduction = 0

			pressureFed = True
			PROPELLANT
			{
				name = LqdAmmonia	//autogenous pressurization
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT	//26 kW
			{
				name = ElectricCharge
				ratio = 70353
				DrawGauge = True
				minResToLeave = 10.0
			}
			atmosphereCurve
			{
				key = 0 786
				key = 1 1
			}
			//one flight experiment, a handful of firings. Arcjet electrode life ~1000 hr class
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedContinuousBurnTime = 900
				ratedBurnTime = 36000

				ignitionReliabilityStart = 0.95
				ignitionReliabilityEnd = 0.995
				cycleReliabilityStart = 0.95
				cycleReliabilityEnd = 0.995
				techTransfer = MR-510-Ammonia,MR-510-Hydrazine:25
			}
		}
	}
}
