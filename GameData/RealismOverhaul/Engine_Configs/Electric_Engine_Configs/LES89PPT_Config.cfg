//	==================================================
//	LES-8/9 Pulsed Plasma Thruster
//
//	Manufacturer: Fairchild Republic / MIT Lincoln Laboratory
//
//	=================================================================================
//	LES-8/9 PPT
//	Teflon (PTFE) ablative pulsed plasma thruster
//
//	Mass: 7.0 Kg fueled (6.7 Kg in some sources), ~1.02 Kg PTFE
//	Thrust (SL): ??? kN
//	Thrust (Vac): ~300 uN average (300 uN*s impulse bit, 12 uN/W)
//	Power: 25 W
//	ISP: ??? SL / 1000 Vac
//	Total Impulse: 10,000 N*s (10,500 in some sources)
//	Capacitor energy: 20 J
//	Efficiency: ~7%
//	Propellant: PTFE (solid, fed by spring)
//	Throttle: by pulse rate
//	Ignitions: Infinite
//	=================================================================================

//	Sources:

//	https://ntrs.nasa.gov/api/citations/20000121223/downloads/20000121223.pdf
//	https://ntrs.nasa.gov/api/citations/19970001354/downloads/19970001354.pdf
//	https://apps.dtic.mil/sti/pdfs/ADA371805.pdf

//	Used by:
//	Flight qualified 1970, LES-8 / LES-9 (launched 1976) - flown but not used operationally

//	==================================================

@PART[*]:HAS[#engineType[LES89PPT]]:FOR[RealismOverhaulEngines]
{
	%title = #roLES89PPTTitle	//LES-8/9 Pulsed Plasma Thruster
	%manufacturer = #roMfrFairchild
	%description = #roLES89PPTDesc

	@tags ^= :$: usa fairchild mit lincoln les ppt pulsed plasma teflon ptfe electric

	%specLevel = operational

	@MODULE[ModuleEngines*]
	{
		%EngineType = Electric
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	!MODULE[ModuleGimbal],*{}

	RESOURCE
	{
		name = PTFE
		amount = 0.4635	//1.02 kg
		maxAmount = 0.4635
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = LES-8-9-PPT
		origMass = 0.00598	//dry, 7.0 kg fueled
		CONFIG
		{
			name = LES-8-9-PPT
			specLevel = operational
			minThrust = 0
			maxThrust = 0.0000003
			heatProduction = 0

			PROPELLANT
			{
				name = PTFE
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT	//25 W
			{
				name = ElectricCharge
				ratio = 1797886
				DrawGauge = True
				minResToLeave = 10.0
			}
			atmosphereCurve
			{
				key = 0 1000
				key = 1 1
			}
			//propellant-limited, 10,000 N*s
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedBurnTime = 34000000

				ignitionReliabilityStart = 0.99
				ignitionReliabilityEnd = 0.9995
				cycleReliabilityStart = 0.99
				cycleReliabilityEnd = 0.9995
				techTransfer = EO-1-PPT:50
			}
		}
	}
}
