//	==================================================
//	MR-501 / MR-502 Electrothermal Hydrazine Thruster
//
//	Manufacturer: Rocket Research Company (later Olin, Primex, Aerojet)
//
//	=================================================================================
//	MR-501
//	Electrothermal hydrazine thruster (EHT)
//
//	Dry Mass: ~1.36 Kg (derived from quoted thrust/weight of ~0.03)
//	Thrust (SL): ??? kN
//	Thrust (Vac): 0.2 - 0.4 N
//	Power: ~0.5 kW
//	ISP: ??? SL / 294-303 Vac
//	Total Impulse: 327 kN*s
//	Propellant: Hydrazine
//	Nozzle Ratio: 200
//	Ignitions: Infinite
//	=================================================================================
//	MR-502 IMPEHT
//	Improved Electrothermal Hydrazine Thruster
//
//	Dry Mass: 0.848 Kg
//	Thrust (SL): ??? kN
//	Thrust (Vac): 0.36 - 0.50 N
//	Power: 0.610 - 0.885 kW
//	ISP: ??? SL / 280-304 Vac
//	Total Impulse: 525 kN*s, 430,000 pulses
//	Chamber Pressure: 0.34 - 0.65 MPa
//	Chamber Temp: 800 C
//	Propellant: Hydrazine (Shell 405 catalyst bed + electric heater)
//	Duty cycle: 300 s minimum to 2 hr maximum
//	Nozzle Ratio: 100
//	Ignitions: Infinite
//	=================================================================================

//	Sources:

//	https://seitzman.gatech.edu/classes/ae6450/electrothermal_thrusters.pdf	(MR-501 series figures)
//	https://www.fplib.org/partners/mwade/engines/mr5mpeht.htm	(MR-502 IMPEHT, archived Astronautix)
//	https://ntrs.nasa.gov/api/citations/19860015278/downloads/19860015278.pdf

//	Used by:
//	MR-501: Satcom 1R (1983), GE/RCA Astro comsats
//	MR-502: Astra 1B (1991), Series 5000 comsats

//	==================================================

@PART[*]:HAS[#engineType[MR501]]:FOR[RealismOverhaulEngines]
{
	%title = #roMR501Title	//MR-501 Electrothermal Hydrazine Thruster
	%manufacturer = #roMfrAerojet
	%description = #roMR501Desc

	@tags ^= :$: usa aerojet rocket research olin primex mr501 501 mr502 502 eht impeht resistojet hydrazine electric

	%specLevel = operational

	@MODULE[ModuleEngines*]
	{
		%EngineType = Electric
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	!MODULE[ModuleGimbal],*{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = MR-501
		origMass = 0.00136
		CONFIG
		{
			name = MR-501
			specLevel = operational
			minThrust = 0.0002
			maxThrust = 0.0004
			heatProduction = 0

			pressureFed = True
			PROPELLANT
			{
				name = Hydrazine
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT
			{
				name = Helium
				ratio = 18.6
				ignoreForIsp = True
			}
			PROPELLANT	//~0.5 kW heater
			{
				name = ElectricCharge
				ratio = 3680
				DrawGauge = True
				minResToLeave = 10.0
			}
			atmosphereCurve
			{
				key = 0 299
				key = 1 1
			}
			//327 kN*s total impulse at 0.4 N
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedContinuousBurnTime = 7200
				ratedBurnTime = 817500

				ignitionReliabilityStart = 0.997
				ignitionReliabilityEnd = 0.9998
				cycleReliabilityStart = 0.995
				cycleReliabilityEnd = 0.9995
				techTransfer = TRW-EHT:50
			}
		}
		CONFIG
		{
			name = MR-502
			description = Improved EHT (IMPEHT). Higher heater power for more thrust and a little more Isp, and a lighter thruster.
			specLevel = operational
			minThrust = 0.00036
			maxThrust = 0.0005
			heatProduction = 0
			massMult = 0.6235	//0.848 kg

			pressureFed = True
			PROPELLANT
			{
				name = Hydrazine
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT
			{
				name = Helium
				ratio = 18.6
				ignoreForIsp = True
			}
			PROPELLANT	//0.885 kW heater
			{
				name = ElectricCharge
				ratio = 5298
				DrawGauge = True
				minResToLeave = 10.0
			}
			atmosphereCurve
			{
				key = 0 304
				key = 1 1
			}
			//525 kN*s total impulse at 0.5 N, 2 hr max continuous
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedContinuousBurnTime = 7200
				ratedBurnTime = 1050000

				ignitionReliabilityStart = 0.998
				ignitionReliabilityEnd = 0.9999
				cycleReliabilityStart = 0.996
				cycleReliabilityEnd = 0.9996
				techTransfer = MR-501,TRW-EHT:50
			}
		}
	}
}
