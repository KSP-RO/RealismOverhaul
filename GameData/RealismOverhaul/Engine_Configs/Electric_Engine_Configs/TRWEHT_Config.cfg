//	==================================================
//	TRW Electrothermal Hydrazine Thruster (EHT)
//
//	Manufacturer: TRW
//
//	=================================================================================
//	Intelsat V Hydrazine Resistojet
//	Electrothermal hydrazine thruster, catalytic decomposition followed by resistive heating
//
//	Dry Mass: 0.35 Kg (derived from quoted thrust/weight of 0.13)
//	Thrust (SL): ??? kN
//	Thrust (Vac): 0.45 N
//	Power: ~0.4 kW
//	ISP: ??? SL / 295 Vac
//	Total Impulse: 80 kN*s
//	Chamber Pressure: ??? MPa
//	Propellant: Hydrazine
//	Prop Ratio: N/A
//	Throttle: N/A (blowdown)
//	Nozzle Ratio: 200
//	Ignitions: Infinite
//	=================================================================================

//	Sources:

//	https://seitzman.gatech.edu/classes/ae6450/electrothermal_thrusters.pdf	(Resistojets slide: "Early deployment on Intelsat V (by TRW)")
//	https://ntrs.nasa.gov/api/citations/19840003138/downloads/19840003138.pdf

//	Used by:
//	Intelsat V (first launch 1980), N-S stationkeeping

//	==================================================

@PART[*]:HAS[#engineType[TRWEHT]]:FOR[RealismOverhaulEngines]
{
	%title = #roTRWEHTTitle	//TRW Hydrazine Resistojet
	%manufacturer = #roMfrTRW
	%description = #roTRWEHTDesc

	@tags ^= :$: usa trw intelsat eht electrothermal resistojet hydrazine electric

	%specLevel = operational

	@MODULE[ModuleEngines*]
	{
		%EngineType = Electric
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	!MODULE[ModuleGimbal],*{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = TRW-EHT
		origMass = 0.00035
		CONFIG
		{
			name = TRW-EHT
			specLevel = operational
			minThrust = 0.00045
			maxThrust = 0.00045
			heatProduction = 0

			pressureFed = True
			PROPELLANT
			{
				name = Hydrazine
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT
			{
				name = Helium
				ratio = 18.6
				ignoreForIsp = True
			}
			PROPELLANT	//0.4 kW heater
			{
				name = ElectricCharge
				ratio = 2582
				DrawGauge = True
				minResToLeave = 10.0
			}
			atmosphereCurve
			{
				key = 0 295
				key = 1 1
			}
			//80 kN*s total impulse at 0.45 N
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedContinuousBurnTime = 7200
				ratedBurnTime = 177800

				ignitionReliabilityStart = 0.995
				ignitionReliabilityEnd = 0.9995
				cycleReliabilityStart = 0.99
				cycleReliabilityEnd = 0.999
			}
		}
	}
}
