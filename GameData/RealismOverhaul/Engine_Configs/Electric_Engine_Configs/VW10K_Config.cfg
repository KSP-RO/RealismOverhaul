//	==================================================
//	VW-10K VASIMR
//
//	Manufacturer: Ad Astra (notional)
//
//	Notional engine, never built. A 10 MW cluster of VASIMR thrusters, as used in Ad Astra's
//	multi-megawatt nuclear-electric (NEP) mission studies (Ilin 2012, Chang Diaz 2013).
//	Those studies size crewed Mars ships at 12-18 MW, a Mars cargo ship at 4 MW and Jupiter
//	cargo missions at 2-15 MW. The "10K" is read as 10,000 kW input power.
//	Performance and mass below are taken from those studies; see Sources.
//
//	=================================================================================
//	VW-10K-Ar		Argon, nominal
//
//	Dry Mass: 9000 kg (0.9 kg/kW: 0.4 kg/kW RF power + 1000 kg per 2 MW of thrusters; no reactor or radiators)
//	Thrust (Vac): 293.7 N
//	Power: 10 MW
//	ISP: 5000 Vac
//	Efficiency: 72% (measured on the VX-200)
//	=================================================================================
//	VW-10K-Ar-HI	Argon, high-Isp
//
//	Thrust (Vac): 142.8 N
//	Power: 10 MW
//	ISP: 10000 Vac (top of the variable-Isp range in the Mars study)
//	Efficiency: 70% (net efficiency assumed in the Mars study)
//	=================================================================================
//	VW-10K-Kr		Krypton, high-thrust
//
//	Thrust (Vac): 648.9 N
//	Power: 10 MW
//	ISP: 2200 Vac (spiral-out Isp in the Mars study)
//	Efficiency: 70% (krypton projection, 2000-5000 s)
//	=================================================================================
//
//	EC ratio = density * g0^2 * Isp^2 / (2000 * efficiency)   (EC per litre of gas)
//	heatProduction = input power (W) * (1 - efficiency), same convention as the other electric configs
//
//	Sources:

//	https://www.adastrarocket.com/technical-papers-archives/NETS2013.pdf
//	https://www.lpi.usra.edu/meetings/nets2012/pdf/3091.pdf
//	https://www.adastrarocket.com/technical-papers-archives/Ben-JPP-2014.pdf

//	Used by:
//	Near Future Propulsion vasimr-25 (VW-10K 'Cyclotron')
//	==================================================

@PART[*]:HAS[#engineType[VW10K]]:FOR[RealismOverhaulEngines]
{
	%title = #roVW10KTitle	//VW-10K VASIMR
	%manufacturer = #roMfrAdAstra
	%description = #roVW10KDesc

	@tags ^= :$: usa ad astra vw10k vw-10k vasimr thruster argon krypton electric nuclear electric

	%specLevel = speculative

	@MODULE[ModuleEngines*]
	{
		%EngineType = Electric
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	!MODULE[ModuleGimbal],*{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = VW-10K-Ar
		origMass = 9.0
		CONFIG
		{
			name = VW-10K-Ar
			description = Efficiency 72%, 0.9 kg/kW, 10 MW input. Cluster of VASIMR thrusters from Ad Astra multi-MW NEP studies. Needs a reactor for power.
			specLevel = speculative
			minThrust = 0.293678
			maxThrust = 0.293678
			heatProduction = 2800000 // efficiency 0.72

			PROPELLANT
			{
				name = ArgonGas
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT
			{
				name = ElectricCharge
				ratio = 2978.11
				minResToLeave = 10.0
				DrawGauge = True
			}
			atmosphereCurve
			{
				key = 0 5000
				key = 1 1
			}

			// never built; reliability not sourced, same as VX-200SS
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedBurnTime = 90000000	//25,000 hours

				ignitionReliabilityStart = 0.99
				ignitionReliabilityEnd = 0.9999
				cycleReliabilityStart = 0.99
				cycleReliabilityEnd = 0.9999

				techTransfer = VX-200SS-Ar,VX-200SS-Kr,VF-200-Ar,VF-200-Kr:50
			}
		}
		CONFIG
		{
			name = VW-10K-Ar-HI
			description = Efficiency 70%, 0.9 kg/kW, 10 MW input. High-Isp setting. Needs a reactor for power.
			specLevel = speculative
			minThrust = 0.142760
			maxThrust = 0.142760
			heatProduction = 3000000 // efficiency 0.70

			PROPELLANT
			{
				name = ArgonGas
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT
			{
				name = ElectricCharge
				ratio = 12252.79
				minResToLeave = 10.0
				DrawGauge = True
			}
			atmosphereCurve
			{
				key = 0 10000
				key = 1 1
			}

			// never built; reliability not sourced, same as VX-200SS
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedBurnTime = 90000000	//25,000 hours

				ignitionReliabilityStart = 0.99
				ignitionReliabilityEnd = 0.9999
				cycleReliabilityStart = 0.99
				cycleReliabilityEnd = 0.9999

				techTransfer = VW-10K-Ar,VW-10K-Kr:50
			}
		}
		CONFIG
		{
			name = VW-10K-Kr
			description = Efficiency 70%, 0.9 kg/kW, 10 MW input. High-thrust setting on krypton. Needs a reactor for power.
			specLevel = speculative
			minThrust = 0.648910
			maxThrust = 0.648910
			heatProduction = 3000000 // efficiency 0.70

			PROPELLANT
			{
				name = KryptonGas
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT
			{
				name = ElectricCharge
				ratio = 1245.25
				minResToLeave = 10.0
				DrawGauge = True
			}
			atmosphereCurve
			{
				key = 0 2200
				key = 1 1
			}

			// never built; reliability not sourced, same as VX-200SS
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedBurnTime = 90000000	//25,000 hours

				ignitionReliabilityStart = 0.99
				ignitionReliabilityEnd = 0.9999
				cycleReliabilityStart = 0.99
				cycleReliabilityEnd = 0.9999

				techTransfer = VW-10K-Ar,VW-10K-Ar-HI:50
			}
		}
	}
}
