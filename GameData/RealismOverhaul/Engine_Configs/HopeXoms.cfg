@PART[*]:HAS[#engineType[HopeXoms]]:FOR[RealismOverhaulEngines]
{
    @title = HOPE-X OMS Engine
    @manufacturer = JAXA
    @description = HOPE-X Orbital Maneuvering Engine, used in a pair.

    %specLevel = operational

    @MODULE[ModuleEngines*]
    {
        %EngineType = LiquidFuel
    }

    !MODULE[ModuleAlternator],*{}
    !MODULE[ModuleEngineConfigs],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        origMass = 0.12
        modded = false
        configuration = HopeX-OMS
        
        CONFIG 
        {
            name = HopeX-OMS
            description = The standard OMS for HOPE-X.
            specLevel = operational
            minThrust = 10
            maxThrust = 15

            PROPELLANT
            {
                name = MMH
                ratio = 0.4943
                DrawGauge = True
            }
            PROPELLANT
            {
                name = MON3
                ratio = 0.5057
                DrawGauge = False
            }
            PROPELLANT
            {
                name = Helium
                ratio = 12.9
                ignoreForIsp = True
            }
            atmosphereCurve
            {
                key = 0 320
                key = 1 120
            }
            massMult = 1.0
            
            %ullage = True
            %pressureFed = True
            %ignitions = 100
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.5
            }

            TESTFLIGHT:NEEDS[TestLite|TestFlight]
            {
                ratedContinuousBurnTime = 1250
                ratedBurnTime = 54000
                
                ignitionReliabilityStart = 0.998820
                ignitionReliabilityEnd = 0.999814
                cycleReliabilityStart = 0.996468
                cycleReliabilityEnd = 0.999442
            }
        }
        CONFIG 
        {
            name = HopeX-OMS-extension
            description = The OMS for HOPE-X equipped with a nozzle extension for higher vacuum efficiency.
            specLevel = operational
            minThrust = 10
            maxThrust = 17

            PROPELLANT
            {
                name = MMH
                ratio = 0.4943
                DrawGauge = True
            }
            PROPELLANT
            {
                name = MON3
                ratio = 0.5057
                DrawGauge = False
            }
            PROPELLANT
            {
                name = Helium
                ratio = 12.9
                ignoreForIsp = True
            }
            atmosphereCurve
            {
                key = 0 350
                key = 1 120
            }
            massMult = 1.05
            
            %ullage = True
            %pressureFed = True
            %ignitions = 100
            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 0.5
            }

            TESTFLIGHT:NEEDS[TestLite|TestFlight]
            {
                ratedContinuousBurnTime = 1250
                ratedBurnTime = 54000
                
                ignitionReliabilityStart = 0.998820
                ignitionReliabilityEnd = 0.999814
                cycleReliabilityStart = 0.996468
                cycleReliabilityEnd = 0.999442
            }
        }
    }
}