//	==================================================
//	Engine: GE5/JZ6C
//
//	Manufacturer: General Electric
//
//	=================================================================================
//	GE5
//	196X, General Electric HYFAC
//
//	Dry Mass: 2042 kg
//	Thrust (Dry): 200.2  kN
//	Thrust (Wet): 266.89 kN
//	SFC (Dry): 0.75  lb/lbf-hr		//assuming the 4800s ISP is the same with or without burner.
//	Area: 1.15  m^2	//Compressor Area (measured using figure)
//	BPR: 0.0 		//Bypass Ratio
//	CPR: 9.0 (guess)	//Compressor Pressure Ratio (split the difference between the j93 and j58)
//	FPR: 0.0		//Fan Ratio
//	Mdes: 3.75 M		//Mach Design Point
//	Tdes: 225 K		//Temp Design Point
//	eta_n: 0.98 		//Efficiency at afterburner rear / nozzle entrance
//	FHV: 98000000 J	//Fuel heat of burning
//	TIT: 1477.6 K		//Combustion peak temp (educated guess)
//	TAB: 3073 * K		//Afterburner peak temp (“stoichiometric afterburner”)
//	maxT3: ??? K	//Turbine max temperature
//	Exhaust Mixer: false
//	Adjustable Nozzle: true
//	=================================================================================
//	JZ6C
//	196X, General Electric HYFAC
//	Envelope M1.0@55kft to M6.0@120kft SFC=1.0 or so
//
//	Dry Mass: N/A kg
//	Thrust: 445 kN
//	Area: 0.68  m^2		//Compressor Area (measured using figure)
//	Mdes: 6.0 M			//Mach Design Point
//	Tdes: 225 K			//Temp Design Point
//	eta_n: 0.98 			//Efficiency at afterburner rear / nozzle entrance
//	FHV: 64800000 J		//Fuel heat of burning		sfc 3.2 M3.0 @ 45kft
//	maxFar: ??? 		//Max fuel to air ratio
//	maxEngineTemp: ??? K	//Engine max temperature
//	=================================================================================

//	Sources:

//	[1] https://ntrs.nasa.gov/api/citations/19710072319/downloads/19710072319.pdf

//	Used by:

//	Notes:
//	==================================================
@PART[*]:HAS[#engineType[GE5JZ6]]:FOR[RealismOverhaulEngines]
{

	%title = #roGE5JZ6Title	//GE5/JZ6C Turbo-Ramjet
	%manufacturer = #roMfrPW
	%description = #roSTRJ11ADesc

	@tags ^= :$: usa general electric turboramjet GE5 JZ6 JZ6C GE5/JZ6C ramjet turbojet

	%specLevel = concept	//operational, prototype, concept, speculative, altHist, sciFi
  // Note: I have no evidence of the engine existing, and I've only seen it mentioned in the HYFAC study, therefore I am concluding it is only a concept.

	!MODULE[ModuleEngines*],*{}

	MODULE
	{
		name = ModuleEnginesAJEJet
		EngineType = Turbine
		thrustVectorTransformName = thrustTransform
		engineID = MainEngine
	}
	MODULE
	{
		name = ModuleEnginesAJERamjet
		EngineType = Turbine
		thrustVectorTransformName = thrustTransform
		engineID = BackupEngine
	}

	@MODULE[ModuleAlternator]
	{
		@RESOURCE[ElectricCharge]
		{
			%rate = 50.0
		}
	}
	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJEJet
		configuration = GE5
		engineID = MainEngine
		isMaster = True
		origMass = 2.042

		CONFIG
		{
			name = GE5
			description = GE5 hydrogen fueled turbojet. Temperature Mach limit at 15 km: 3.75.
			specLevel = concept
			massMult = 1.00

			Area = 1.15		//Compressor Area
			BPR = 0.0		//Bypass Ratio
			CPR = 9.0		//Compressor Pressure Ratio
			FPR = 0.0		//Fan Ratio
			Mdes = 3.75		//Mach Design Point
			Tdes = 280		//Temp Design Point
			eta_c = 0.95	//Efficiency at burner inlet
			eta_t = 0.98	//Efficiency at burner exit
			eta_n = 0.9		//Efficiency at afterburner rear / nozzle entrance
			FHV = 98000000	//Fuel heat of burning (joules?)
			TIT = 1477.6		//Combustion peak temp
			TAB = 3073		//Afterburner temp?
			maxT3 = 1500		//Turbine max temperature
      tt7_max = 5000	//manually override solver max temp to get hydrogen engines to work
			exhaustMixer = False
			adjustableNozzle = True
			thrustUpperLimit = 300

			// Engine fitting params
			defaultTPR = 0.85
			dryThrust = 200.2
			wetThrust = 266.89
			maxThrust = 266.89	//Just to let MEC know thrust
			drySFC = 0.75
			throttleResponseMultiplier = 0.20

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}

			OtherModules
			{
				BackupEngine = JZ6C
			}
		}
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJERamjet
		configuration = JZ6C
		engineID = BackupEngine
		isMaster = False

		CONFIG
		{
			name = JZ6C
			description = JZ6C Annular Ramjet, surrounds the GE5 to form the GE5/JZ6C Turboramjet. Design speed M6.0@120kft.
			specLevel = concept
			massMult = 1.0	// Mass of Ramjet *and* Turbojet
			heatProduction = 10

			Area = 0.68		//Compressor Area (2.38 m2 is also quoted, which minus the j58 gives 1.8)
			Mdes = 6.0		//Mach Design Point
			Tdes = 225		//Temp Design Point
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 64800000	//Fuel heat of burning (joules?) (72900000 might be a bit better?)
			maxFar = 0.07	//calculated using density of air at 100kft, a speed of Mach 6 (312m/s assumed for mach at altitude) and engine inlet, combined with total hydrogen mass of the vehicle divided across a 10 minute runtime.
			maxEngineTemp = 6000
			thrustUpperLimit = 445

			// Engine fitting params
			maxThrust = 445	//Just to let MEC know thrust
			throttleResponseMultiplier = 1.0

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}
