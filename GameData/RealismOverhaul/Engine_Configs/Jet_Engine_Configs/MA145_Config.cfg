//	==================================================
//	Engine: MA145-XAB
//
//	Manufacturer: Marquardt
//
//	=================================================================================
//	MA145-XAB
//	1968
//	Envelope M3.0 to M8.0 @??.?kft?
//
//	Dry Mass: 113.4 kg
//	Thrust: 111.2 kN
//	Area: 0.164 m^2		//Compressor Area
//	Mdes: 8.0 M			//Mach Design Point
//	Tdes: 225 K			//Temp Design Point
//	eta_n: 0.98			//Efficiency at afterburner rear / nozzle entrance
//	FHV: 64800000 J		//Fuel heat of burning
//	maxFar: 0.0292		//Max fuel to air ratio  (Equivalence ratio of 1, meaning stoichiometric I think?????)
//	maxEngineTemp: 6300 K	//Engine max temperature  (source quotes 3030K or so)
//	=================================================================================

//	Sources:

//  https://ntrs.nasa.gov/api/citations/19920012288/downloads/19920012288.pdf  (Note: I am assuming the 1968 Mach 8 ramjet is this engine, given a really low likelihood of any other engines of this size and spec being researched at the same time.)
//	https://arc.aiaa.org/doi/abs/10.2514/1.9200?journalCode=jsr
//  https://ntrs.nasa.gov/api/citations/19710072317/downloads/19710072317.pdf
//  https://ntrs.nasa.gov/api/citations/19710072318/downloads/19710072318.pdf


//	Used by:

//	Notes:

//	18 inches dia
//	design M8.0
//	==================================================
@PART[*]:HAS[#engineType[MA145]]:FOR[RealismOverhaulEngines]
{

	%title = #roMA145Title	//MA145 Ramjet
	%manufacturer = #roMfrMarquardt
	%description = #roMA145

	@tags ^= :$: usa marquardt MA-145 MA145 ramjet

	%specLevel = prototype	//operational, prototype, concept, speculative, altHist, sciFi

	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesAJERamjet
		%EngineType = Turbine
		@PROPELLANT[LiquidFuel]
		{
			@name = Kerosene
		}
	}

	!MODULE[ModuleAlternator]{}
	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJERamjet
		configuration = MA-145
		modded = false
		origMass = 0.1134

		CONFIG
		{
			name = MA-145-XAB
			description = MA-145, as tested in 1968, uprated for 161,000 lbf. Design speed M6.0@25.9 km.
			specLevel = prototype
			massMult = 1.00
			heatProduction = 10
			
			Area = 0.164		//Compressor Area
			Mdes = 6.0		//Mach Design Point
			Tdes = 225		//Temp Design Point
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 64800000	//Fuel heat of burning (joules?)
			maxFar = 0.0292
			maxEngineTemp = 6300
			thrustUpperLimit = 111.2
			
			// Engine fitting params
			maxThrust = 111.2	//Just to let MEC know thrust
			throttleResponseMultiplier = 1.0

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}
