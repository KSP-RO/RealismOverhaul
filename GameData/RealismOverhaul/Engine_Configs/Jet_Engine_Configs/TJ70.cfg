//	==================================================
//	Engine: TJ70
//
//	Manufacturer: Curtiss Wright
//
//	=================================================================================
///	TJ70A4
//	1975, L-2000
//
//	Dry Mass: 3175 kg
//	Thrust (Dry): 242.872 kN
//	Thrust (Wet): 0 kN
//	SFC (Dry): 0.97  lb/lbf-hr (1.5 at cruise, 0.97 in climb)
//	Area: ???  m^2	//Compressor Area
//	BPR: 0.0		//Bypass Ratio
//	CPR: 9.0 		//Compressor Pressure Ratio (Assuming this is the same as Overall PR)
//	FPR: 0.0		//Fan Ratio
//	Mdes: 2.0 M		//Mach Design Point (0.9 may work better?)
//	Tdes: 280 K		//Temp Design Point
//	eta_n: 0.9		//Efficiency at afterburner rear / nozzle entrance
//	FHV: 36000000 J	//Fuel heat of burning
//	TIT: 1477.5 K		//Combustion peak temp 
//	TAB: 0  K		//Afterburner peak temp
//	maxT3: 1100 K	//Turbine max temperature (assuming this is the same as the GE4…)
//	Exhaust Mixer: false
//	Adjustable Nozzle: true
//	=================================================================================

//	Sources:

//	https://en.wikipedia.org/wiki/General_Electric_GE4
//	https://www.secretprojects.co.uk/threads/ge4-turbojet-boeing-2207-sst.486/
//	https://archive.org/details/NASA_NTRS_Archive_19770011052/page/n369/mode/1up
//	https://web.archive.org/web/20101003014616/http://www.dtic.mil/cgi-bin/GetTRDoc?AD=AD378492&Location=U2&doc=GetTRDoc.pdf

//	Used by:

//	Notes:

//	==================================================
@PART[*]:HAS[#engineType[TJ70]]:FOR[RealismOverhaulEngines]
{

	%title = #roGE4Title	//GE4 Turbojet
	%manufacturer = #roMfrGE
	%description = #roGE4Desc

	@tags ^= :$: usa curtiss wright cw tj70 j5p j6h SST turbojet

	%specLevel = prototype	//operational, prototype, concept, speculative, altHist, sciFi

	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesAJEJet
		%EngineType = Turbine
		@PROPELLANT[LiquidFuel]
		{
			@name = Kerosene
		}
	}
	@MODULE[ModuleAlternator]
	{
		@RESOURCE[ElectricCharge]
		{
			%rate = 100.0
		}
	}

	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJEJet
		configuration = TJ70A4
		modded = false
		origMass = 3.175

		CONFIG
		{
			name = TJ70A4
			description = TJ70A4 turbojet, as designed for the Lockheed L-2000. Temperature Mach limit at 15 km: 3.56.
			specLevel = concept
			massMult = 1.0
			
			Area = 0.75		//Compressor Area (placeholder, might be wrong!)
			BPR = 0.0		//Bypass Ratio
			CPR = 9.0		//Compressor Pressure Ratio (assuming this is the same as total pressure ratio...)
			FPR = 0.0		//Fan Ratio
			Mdes = 2.0		//Mach Design Point (doccument said the engine was most efficient between 2.0 & 3.5 Mach)
			Tdes = 280		//Temp Design Point
			eta_c = 0.95	//Efficiency at burner inlet
			eta_t = 0.98	//Efficiency at burner exit
			eta_n = 0.9		//Efficiency at afterburner rear / nozzle entrance
			FHV = 36000000	//Fuel heat of burning (joules?)
			TIT = 1477.5		//Combustion peak temp
			TAB = 0		//Afterburner temp?
			maxT3 = 1100		//Turbine max temperature
			exhaustMixer = False
			adjustableNozzle = True
			thrustUpperLimit = 550
			
			// Engine fitting params
			defaultTPR = 0.85 //No Idea what this even does :D
			dryThrust = 242.87
			wetThrust = 0
			maxThrust = 242.87	//Just to let MEC know thrust
			drySFC = 0.97
			throttleResponseMultiplier = 0.60

			PROPELLANT
			{
				name = Kerosene
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}
