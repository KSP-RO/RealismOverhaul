// =================================================================================
//  Open-Cycle Gas Core NTR (ntr-gc-25-2)
//  Dry Mass: 35000 Kg        [1] Lightest engine weight from study's design range
//  Thrust (SL): 440 kN
//  Thrust (Vac): 1100 kN
//  ISP: 1200 SL / 3000 Vac   [1] Low end of study's 3000-7000s Isp range
//  Burn Time: 1800/28800     [E] Estimate — no NASA source found
//  Chamber Pressure: 10.13 MPa   [1] Matches reactor/hydrogen feed pressure (~5-10 MPa range)
//  Chamber Temp: 22000 K     [1][2] Plasma temp cited for high-Isp operation
//  Propellant: LH2 / EnrichedUranium
//  Prop Ratio: N/A
//  Throttle: 40% min throttle (Plasma hydrodynamic stability limit)   [E] Estimate — no NASA source found
//  Nozzle Ratio: 200:1        [E] Estimate — no NASA source found
//  Ignitions: 15              [E] Estimate — no NASA source found
//
//  SOURCES:
//  [1] NASA TM X-2243 (Ragsdale, 1971): "High-Specific-Impulse Gas-Core Reactors."
//      Engine weight/pressure/temperature estimates for open-cycle gas-core NTR
//      across Isp 3000-7000s and thrust 4.4x10^4 to 1.1x10^6 N.
//  [2] NASA TM X-67823 (Ragsdale & Willis, 1971): "Gas Core Rocket Reactors —
//      A New Look." Discusses 22,000 K plasma temperature requirement.
//  [E] =  Estimate not traced to a NASA source.
// =================================================================================
@PART[*]:HAS[#engineType[OpenCycleGasCore]]:FOR[RealismOverhaulEngines]
{
	%title = Open-Cycle Gas Core NTR
	%manufacturer = Aerojet
	%description = High-thrust, extremely high-Isp open-cycle gas core nuclear thermal engine. Uses a gaseous uranium core to superheat hydrogen propellant directly. Note that open-cycle gas core engines vent radioactive fission products in their exhaust.
	%specLevel = concept
    @tags ^= :$: USA aerojet rocketdyne ajr open cycle gas core ntr nuclear pump upper lqdhydrogen
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = OpenCycleGasCore
		origMass = 35.0

		CONFIG
		{
			name = OpenCycleGasCore
			minThrust = 440
			maxThrust = 1100
			heatProduction = 100
			
			ullage = True
			pressureFed = False
			ignitions = 20
			throttleResponseRate = 0.05
			
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 2.0
			}

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}

			PROPELLANT
			{
				name = EnrichedUranium
				ratio = 0.0000001
				ignoreForIsp = True
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 2850
				key = 1 1150
			}
            TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedContinuousBurnTime = 1800
				ratedBurnTime = 28800

				explicitDataRate = True
				ignitionReliabilityStart = 0.95
				ignitionReliabilityEnd = 0.995
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.96
				cycleReliabilityEnd = 0.999
				reliabilityMidV = 0.8
				reliabilityMidH = 0.1
				reliabilityMidTangentWeight = 0
				reliabilityDataRateMultiplier = 90
			}
		}
	}

	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 3.0
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 6
	}

	RESOURCE
	{
		name = EnrichedUranium
		amount = 35
		maxAmount = 35
	}
	RESOURCE
	{
		name = DepletedFuel
		amount = 0
		maxAmount = 35
	}
}