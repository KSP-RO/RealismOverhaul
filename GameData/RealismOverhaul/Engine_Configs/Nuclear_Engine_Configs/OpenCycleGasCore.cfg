// =================================================================================
//  Open-Cycle Gas Core NTR (ntr-gc-25-2)
//
//  All variants share the NASA Lewis spherical-cavity reactor: ~2.4 m cavity,
//  D2O / graphite / BeO moderator-reflector (~27-28 t), 23-27 kg U-235 critical
//  mass [1][3]. Variants trade Isp against thrust and mass. Engine masses from
//  [1] and [3] include the space radiator where one is needed (above ~3000 s).
//
//  Common to all variants:
//  Thrust (SL): N/A          [1] Deep-space engine; no sea-level case studied
//  ISP (SL): 1               With a 200:1 nozzle, ambient pressure on the exit
//                                 exceeds the vacuum thrust
//  Burn Time: 1800/28800     [E] Estimate -- no NASA source found
//  Chamber Pressure: 10.14-101.4 MPa   [3] 100-1000 atm depending on reactor power;
//                                 per-variant value not given. Not used in-game
//  Propellant: LH2 / EnrichedUranium
//  Uranium volume ratio = 3.709e-3 / (H2:U mass ratio), assuming LH2 0.07085 kg/L
//                                 and EnrichedUranium 19.1 kg/L (CRP)
//  Throttle: 40% min throttle (Plasma hydrodynamic stability limit)   [E] Estimate -- no NASA source found
//  Nozzle Ratio: 200:1        [E] Estimate -- no NASA source found
//  Ignitions: 60              [E] Estimate -- no NASA source found; matches the
//                                 NERVA / BNTR configs. Restart is plausible: [1] describes
//                                 startup by re-seeding the cavity with uranium particles
//  Uranium load: 35 units (~670 kg), must keep 23-27 kg in the cavity [3]
//
//  ---------------------------------------------------------------------------------
//  OpenCycleGasCore-1800 (high thrust)
//  Dry Mass: 130000 Kg       [1] Ref. 4 design: 1.76x10^6 N, 1800 s, ~130000 kg
//  Thrust (Vac): 1760 kN     [1]
//  ISP: 1 SL / 1800 Vac      [1]
//  Chamber Temp: ~6400 K     [3][E] H2 temperature, interpolated between 5600 K
//                                 for 1500 s [3] and 8300 K for 2500 s [1]
//  Prop Ratio: H2:U = 100    [1] Ref. 4 assumed flow ratio -> volume ratio 3.71e-5
//                                 ~1 kg/s uranium loss at full thrust: the 35-unit
//                                 load lasts ~11 min. Heavy uranium resupply needed
//  ---------------------------------------------------------------------------------
//  OpenCycleGasCore (3000 s, baseline)
//  Dry Mass: 100000 Kg       [1][3][E] Bracketed by the sources, not read directly:
//                                 50 t at 3000 s / 4.4x10^4 N [1]; 91 t at 5000 s /
//                                 1.1x10^5 N [1]; 132 t at 5000 s / 2.22x10^5 N [3].
//                                 At 3000 s no space radiator is needed [1], which keeps
//                                 it lighter than the 5000 s cases. The exact value is
//                                 on [1] figure 6 (scanned) -- replace if read off.
//  Thrust (Vac): 440 kN      [1] 4.4x10^5 N, top of study thrust range
//  ISP: 1 SL / 3000 Vac      [1] Low end of study's 3000-7000 s range
//  Chamber Temp: ~11000 K    [1][3][E] H2 temperature, interpolated between 8300 K for
//                                 2500 s [1] and 22000 K for 5000 s [1][3]
//  Prop Ratio: H2:U = 300    [3] 1/400 to 1/200 expected -> volume ratio 1.24e-5
//  ---------------------------------------------------------------------------------
//  OpenCycleGasCore-5000 (high Isp)
//  Dry Mass: 132000 Kg       [3] 132000 kg at 2.22x10^5 N, 5000 s; includes 1100 K
//                                 vapor-fin space radiator
//  Thrust (Vac): 222 kN      [3] 2.22x10^5 N; reactor power 7500 MW
//  ISP: 1 SL / 5000 Vac      [1][3]
//  Chamber Temp: 22000 K     [1][3] H2 temperature required for 5000 s
//  Prop Ratio: H2:U = 300    [3] -> volume ratio 1.24e-5
//  ---------------------------------------------------------------------------------
//  OpenCycleGasCore-7000 (maximum Isp)
//  Dry Mass: 73000 Kg        [1] 73000 kg at 4.4x10^4 N, 7000 s; includes radiator
//  Thrust (Vac): 44 kN       [1] 4.4x10^4 N
//  ISP: 1 SL / 7000 Vac      [1][3] ~7000 s upper limit of the concept
//  Chamber Temp: N/A         Not given in [1] or [3]; above 22000 K
//  Prop Ratio: H2:U = 300    [3] -> volume ratio 1.24e-5
//  ---------------------------------------------------------------------------------
//
//  SOURCES:
//  [1] NASA TM X-2243 (Ragsdale, 1971): "High-Specific-Impulse Gas-Core Reactors."
//      Engine weight estimates for open-cycle gas-core NTR across Isp 3000-7000 s
//      and thrust 4.4x10^3 to 4.4x10^5 N; engine weight 35000-380000 kg. Also
//      summarizes its ref. 4 (Ragsdale, AIAA Paper 70-690, 1970) 1800 s design.
//      https://ntrs.nasa.gov/citations/19710010425
//  [2] NASA TM X-67823 (Ragsdale & Willis, 1971): "Gas Core Rocket Reactors --
//      A New Look." Record only; full text not online, no values taken from it.
//      https://ntrs.nasa.gov/citations/19710014431
//  [3] NASA TM X-2259 (1971): "Status of Open-Cycle Gas-Core Reactor Project
//      Through 1970." Operating pressure, critical mass, uranium loss rate,
//      plasma temperature, 51-132 t engine weights at 5000 s.
//      https://ntrs.nasa.gov/citations/19710010820
//  [E] =  Estimate not traced to a NASA source.
// =================================================================================
@PART[*]:HAS[#engineType[OpenCycleGasCore]]:FOR[RealismOverhaulEngines]
{
	%category = Engine
	%title = Open-Cycle Gas Core NTR
	%manufacturer = NASA Lewis Research Center
	%description = High-Isp open-cycle gas core nuclear thermal engine, based on 1970s NASA Lewis studies. A fissioning uranium plasma radiates heat directly into the hydrogen propellant. Some uranium is carried out with the exhaust and must be resupplied, and the exhaust carries radioactive fission products. Variants range from a high-thrust 1800 s engine to a 7000 s engine with an integrated space radiator. Vacuum only.
