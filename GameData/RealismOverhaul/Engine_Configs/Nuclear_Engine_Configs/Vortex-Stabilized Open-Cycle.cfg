// =================================================================================
//  Vortex-Stabilized Open-Cycle NTR (ntr-gc-25-3)
//  Open-Cycle Gas Core, Vortex-Stabilized (Fluid-Mechanics Confinement)
//
//  Dry Mass: 63500 Kg        [1] 140,000 lb (results summary). Matches moderator
//                                 configuration E (all modifications): 65,296 lb
//                                 components + 72,500 lb pressure vessel = 137,796 lb
//                                 [1] table XVII. Original design A: 170,200 lb
//  Thrust (SL): N/A          [1] No sea-level case studied. Reference mission starts
//                                 the engine after Saturn IC boost (suborbit start)
//  Thrust (Vac): 6450 kN     [1] 1.45x10^6 lbf
//  ISP: 1700 SL / 2190 Vac   [1] 2190 s vacuum. SL is [E]: ~78% ratio of a flown
//                                 aerospike (XRS-2200: 339 s SL / 436 s vac), used
//                                 because the part model is an aerospike. [1] gives
//                                 no nozzle type or area ratio
//  Burn Time: 1330/3000      [1][E] Continuous: reference mission burns 875,000 lb of
//                                 propellant at 660 lb/s = ~1330 s [1]. Total: estimate
//  Chamber Pressure: 101.3 MPa   [1] 1000 atm cavity pressure
//  Chamber Temp: N/A         [1] Propellant exit temperature not given for this
//                                 engine. Fuel-region temperatures: 102,000 R (~56,700 K)
//                                 at fuel edge, 136,000 R (~75,600 K) on centerline;
//                                 cavity wall ~5000 R (~2780 K) [1] table XI
//  Propellant: LH2 / EnrichedUranium
//  Prop Ratio: H2:U = 36.9 by mass   [1] Minimum ratio to justify development (mission
//                                 cost one-third of solid-core). Break-even is 9.76.
//                                 [1]'s fluid-mechanics tests indicate real retention
//                                 is worse than this, so 36.9 is optimistic.
//                                 Volume ratio 1.005e-4 assumes LH2 0.07085 kg/L and
//                                 EnrichedUranium 19.1 kg/L (CRP)
//  Uranium Loss: ~8.1 kg/s at full thrust   [1] From the ratio above and 300 kg/s H2
//  Uranium Load: 565 units (~10.8 t)   [1] Reference mission fuel loss: 23,700 lb
//                                 (10,750 kg) for 875,000 lb propellant
//  Critical Mass: 36.2 lb (16.4 kg)   [1]
//  Reactor Power: 90,000 MW  [1]
//  Throttle: 40% min throttle [E] No throttling data -- [1] is a fixed-point design
//  Nozzle Ratio: N/A          [E] Not specified for this configuration in [1]
//  Ignitions: 20             [E] Gameplay choice. [1]'s reference mission is a
//                                 single burn
//
//
//  NOTES:
//  Fuel confinement relies entirely on centrifugal/fluid-mechanics effects from a
//  swirling vortex flow field -- no physical wall separates the fissioning uranium
//  plasma from the hydrogen propellant. The source report's own fluid mechanics
//  testing found this approach could NOT achieve economic fuel retention at
//  full-scale Reynolds numbers (480,000), which is why UARL redirected its follow-on
//  work toward the closed-cycle Nuclear Light Bulb design instead. Presented here as
//  a studied-but-abandoned NASA/UARL concept.
//
//  SOURCES:
//  [1] NASA CR-1030 (McLafferty & Bauer, United Aircraft Research Labs, 1968):
//      "Studies of Specific Nuclear Light Bulb and Open-Cycle Vortex-Stabilized
//      Gaseous Nuclear Rocket Engines." Open-cycle reference design: 1000 atm
//      cavity pressure, 2190 s Isp, 1.45x10^6 lbf thrust, 660 lb/s propellant,
//      90,000 MW, 140,000 lb engine weight, fuel/propellant density ratio of 10.0.
//      Fuel loss criteria in table XVIII; design point from its ref. 11 (NASA CR-698).
//      https://ntrs.nasa.gov/citations/19680012569
//  [E] =  Estimate not traced to a NASA source.
//
// =================================================================================
@PART[*]:HAS[#engineType[VortexOpenCycle]]:FOR[RealismOverhaulEngines]
{
    %category = Engine
    %title = Vortex-Stabilized Open-Cycle NTR
    %manufacturer = United Aircraft Research Laboratories
    %description = An open-cycle gas core nuclear thermal engine relying entirely on vortex fluid dynamics to confine fissioning uranium plasma against a surrounding hydrogen propellant stream, without any physical containment wall. Enormous thrust at roughly 2.5x solid-core Isp, but it sheds uranium fast: about 8 kg every second at full thrust, even at the best retention the designers hoped for. Historical fluid-mechanics testing found fuel retention insufficient for practical use -- an experimental dead end abandoned in favor of the Nuclear Light Bulb concept.
    %specLevel = concept
    @tags ^= :$: USA uarl unitedaircraft vortex opencycle gas core ntr nuclear pump upper lqdhydrogen

    @MODULE[ModuleEngines*]
    {
        %EngineType = LiquidFuel
    }

    !MODULE[Module*EngineConfigs],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = VortexOpenCycle
        origMass = 63.5

        CONFIG
        {
            name = VortexOpenCycle
            minThrust = 2580
            maxThrust = 6450
            heatProduction = 220

            ullage = True
            pressureFed = False
            ignitions = 20
            throttleResponseRate = 0.03

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 5.0
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 1.0
                DrawGauge = True
            }

            PROPELLANT
            {
                name = EnrichedUranium
                ratio = 0.0001005
                ignoreForIsp = True
                DrawGauge = True
            }

            atmosphereCurve
            {
                key = 0 2190
                key = 1 1700
            }

            TESTFLIGHT:NEEDS[TestLite|TestFlight]
            {
                ratedContinuousBurnTime = 1330
                ratedBurnTime = 3000

                explicitDataRate = True
                ignitionReliabilityStart = 0.85
                ignitionReliabilityEnd = 0.97
                ignitionDynPresFailMultiplier = 0.1
                cycleReliabilityStart = 0.88
                cycleReliabilityEnd = 0.97
                reliabilityMidV = 0.8
                reliabilityMidH = 0.1
                reliabilityMidTangentWeight = 0
                reliabilityDataRateMultiplier = 30
            }
        }
    }

    @MODULE[ModuleGimbal]
    {
        %gimbalRange = 1.0
        %useGimbalResponseSpeed = true
        %gimbalResponseSpeed = 4
    }

    RESOURCE
    {
        name = EnrichedUranium
        amount = 565
        maxAmount = 565
    }
}
