//	==================================================
//	Sea Dragon engines (Truax design, 1962)
//
//	=================================================================================
//	=================================================================================
//	Stage 2 (SeaDragonS2)
//
//	Dry Mass: 70.044 t
//	Thrust (Vac): 62.8 MN
//	ISP: 409 Vac				extended nozzle, ~27:1
//	Burn Time: 260 (source); rated 300 to cover the ~297 s the RO tank load actually burns
//	Chamber Pressure: ~7 atm
//	Propellant: LOX / LH2
//	Prop Ratio: 5.0
//	Throttle: N/A (pressure-fed, fixed)
//	Ignitions: 1
//	=================================================================================
//	(1) https://en.wikipedia.org/wiki/Sea_Dragon_(rocket)
//	(2) http://www.astronautix.com/s/seadragon.html
//	Notes:
//	Never built or flown, so specLevel = concept and no real TESTFLIGHT data exist.
//	Stage 2 sea-level Isp is a placeholder: at ~7 atm chamber pressure and a 27:1 nozzle
//	the flow is heavily separated at 1 atm, so this stage is never meant to fire there.

@PART[*]:HAS[#engineType[SeaDragonS2]]:FOR[RealismOverhaulEngines]
{
	%title = #roSeaDragonS2Title
	%manufacturer = #roMfrAerojet
	%description = #roSeaDragonS2esc

	@tags ^= :$: USA aerojet truax sea-dragon liquid pressure-fed upper lqdhydrogen lqdoxygen

	%specLevel = concept

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
		%throttleLocked = True
	}

	!MODULE[ModuleEngineConfigs],*{}
	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}

	// gimbal range left at the mod's own value
	@MODULE[ModuleGimbal]
	{
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 16
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		origMass = 70.044
		configuration = SeaDragon-Stage2
		modded = false

		CONFIG
		{
			name = SeaDragon-Stage2
			description = Pressure-fed hydrolox second stage engine
			specLevel = concept
			maxThrust = 62800
			minThrust = 62800		// fixed thrust
			ratedBurnTime = 300
			heatProduction = 100
			massMult = 1.0

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7631
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2369
			}

			atmosphereCurve
			{
				key = 0 409
				key = 1 100			// PLACEHOLDER, see notes above
			}

			ullage = False
			pressureFed = True
			ignitions = 1
			residualsThresholdBase = 0.006	// ESTIMATE: no data, J-2-like 0.6%; RF default strands ~190 t on a tank this size
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.8
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 300
				ratedBurnTime = 300
				safeOverburn = false
				ignitionReliabilityStart = 0.90
				ignitionReliabilityEnd = 0.98
				cycleReliabilityStart = 0.90
				cycleReliabilityEnd = 0.98
			}
		}
	}
}