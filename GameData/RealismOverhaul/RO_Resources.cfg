//Advanced propulsion fuels (used by the Fusion, Antimatter and Fission tank types in RO_RealFuels.cfg)
//Prices are 1965 funds per unit (1 fund = $1000 of 1965), same as RP-1's ResourceCosts.cfg.
//Dollar figures from other years are converted with the US CPI-U annual average
//(1964 31.0, 1965 31.5, 1972 41.8, 1998 163.0, 2006 201.6, 2008 215.3, 2020 258.8).

//Americium-241, about $1500/g (2008$), "almost unchanged" since sales began in 1962: https://en.wikipedia.org/wiki/Americium
//-> $219.5/g 1965$; particles at 1.44 kg/L -> 1440 g/L -> 316 per L
@RESOURCE_DEFINITION[FissionParticles]:FOR[RealismOverhaul]
{
	@unitCost = 316
}
//Curium-244 projected at $1000/g (ORNL catalogue, Feb 1962 prices): BNWL-25, "Values in spent fuel from power reactors",
//March 1965, https://www.osti.gov/servlets/purl/4618921
//Pulse unit ~2 kg with 42.8 g of curium at 1.0 kg/L -> 21.4 g/L -> 21.4 per L
@RESOURCE_DEFINITION[FissionPellets]:FOR[RealismOverhaul]
{
	@unitCost = 21.4
}
//AEC base price for plutonium with 6-12% Pu-240: $43/g (~1972), Minerals Yearbook:
//https://search.library.wisc.edu/digital/AMNS3JOQHHHFEG9C/text/AKE3SCNXHWDIS685 -> $32.4/g 1965$
//(AEC lease base charge was $12/g in 1961, purchase price $9.28/g in 1969). ~2% fissiles in water at 1.05 kg/L -> 21 g/L
@RESOURCE_DEFINITION[NuclearSaltWater]:FOR[RealismOverhaul]
{
	@unitCost = 0.6805
}
//Orion pulse unit, 79 kg: a 1964 estimate put it at $40,000 or less each in mass production:
//https://en.wikipedia.org/wiki/Project_Orion_(nuclear_propulsion) -> $40,645 1965$
@RESOURCE_DEFINITION[FissionPulses]:FOR[RealismOverhaul]
{
	@density = 0.079
	@unitCost = 40.6
}
//Lithium metal, 99.5-99.8%: $9-11/lb throughout 1964 and 1967 (Bureau of Mines Minerals Yearbook):
//https://search.library.wisc.edu/digital/AIRU5C6ME66MHM8X/text/AXOFOYELBJLCTM8X
//https://search.library.wisc.edu/digital/AGFCCUKXF4SS2G8F/text/AWITSY6HJ26NXF8P
//$10/lb = $22.05/kg at 0.534 kg/L -> 0.01177 per L
@RESOURCE_DEFINITION[Lithium]:FOR[RealismOverhaul]
{
	@unitCost = 0.01177
}
//Antimatter, 1 unit = 1 mg (CRP density 1e-9 t). Today's collider production is ~$1e12/mg; a dedicated antiproton
//factory is estimated at ~$1e7/mg (Forward; RAND 1998, cited in NASA MSFC "Antimatter Propulsion", LaPointe:
//https://ntrs.nasa.gov/api/citations/20200001904/downloads/20200001904.pdf). $10M/mg 1998$ -> $1.93M 1965$
@RESOURCE_DEFINITION[Antimatter]:FOR[RealismOverhaul]
{
	@unitCost = 1932.5
}
//Fusion pellets priced at their fuel content: the pellet recipe takes 0.195 L LqdDeuterium + 0.805 L LqdHe3 per L
//(40/60 D:He-3 by mass) -> 0.195 x 0.04984 + 0.805 x 4.281 = 3.456 per L.
//Target fabrication is not included: ~$0.16-0.17 per target at IFE production scale (Goodin, General Atomics:
//https://aries.pppl.gov/LIB/MEETINGS/0302-GA-IFE/presentations/goodin%20long%20version.pdf), but targets per litre aren't sourced.
@RESOURCE_DEFINITION[FusionPellets]:FOR[RealismOverhaul]
{
	@unitCost = 3.456
}

//Fusion fuel prices:
//  D2:   AEC heavy water price $28/lb through the 1960s (IAEA Bulletin, "Heavy water at Aswan":
//        https://www.iaea.org/sites/default/files/publications/magazines/bulletin/bull0-0/00005882021.pdf).
//        1 L of liquid D2 (162.4 g, CRP density) needs 807.4 g = 1.780 lb of D2O -> $49.84 -> 0.04984 per L.
//  He-3: $40-85 per litre of gas (STP) over 2003-2009 (GAO-11-472, https://www.gao.gov/assets/gao-11-472.pdf);
//        $62.5/L 2006$ -> $9.77/L 1965$. 1 L of liquid (59 g) is 438.3 L of gas (0.1346 g/L) -> 4.281 per L.
//  T2:   about $30,000/g (2020$, "U.S. Tritium Production for the Nuclear Weapons Stockpile", Lynceans:
//        https://lynceans.org/wp-content/uploads/2020/05/US-tritium-production-for-the-nuclear-weapons-stockpile-%E2%80%93-not-like-the-old-days.pdf)
//        -> $3,652/g 1965$ x 320 g/L (CRP density) -> 1168.5 per L.
//Fusion fuel boiloff goes through RealFuels: RF reads vsp (heat of vaporization, kJ/tonne) and
//conductivity (W/m-K) straight off RESOURCE_DEFINITION, same as ResourceHsps.cfg does for LH2/LOX.
//vsp = molar heat of vaporization at the normal boiling point / molar mass (J/mol / g/mol = kJ/kg = kJ/tonne / 1000 -> x1000).
//Same method reproduces RF's own LH2 value: 0.904 kJ/mol / 2.016 g/mol = 448.4 kJ/kg (RF ResourceHsps.cfg: vsp = 448500).
//Sources:
//  He-3: NBP 3.19 K, 0.026 kJ/mol, liquid 59 g/L - https://en.wikipedia.org/wiki/Helium-3 (Physical properties; cites Chase & Zimmerman 1973)
//  D2:   NBP 23.67 K, 293 cal/mol = 1.226 kJ/mol - https://www.britannica.com/science/deuterium (property table);
//        292.5-293.9 cal/mol at NBP measured by Kerr et al. 1951, per Woolley, Scott & Brickwedde, J. Res. NBS 41 (1948)
//        https://nvlpubs.nist.gov/nistpubs/jres/041/5/v41.n05.a03.pdf
//        Liquid conductivity 0.126 W/m-K at 20.4 K - PubChem Deuterium (HSDB; listed as "12.6 W/cm K", a unit typo for 12.6e-4)
//  T2:   NBP 25.04 K and heat of vaporization 1390 J/mol (Kirk-Othmer, via PubChem Tritium, HSDB 6467).
//        Cross-check: Souers & Briggs, "Hydrogen Vapor Pressures from 4 to 30 K: A Review", UCRL-52226 (LLNL 1977),
//        https://www.osti.gov/servlets/purl/7110677 - Table 1 T2: lnP(Pa) = 19.11365 - 182.0038/T - 0.02560401 T + 5.133943e-4 T^2
//        gives 1 atm at 25.04 K and H_eff = R(-B + C T^2 + 2 D T^3) = 1514 J/mol there (same formula reproduces their
//        tabulated 1497.59 J/mol at the 20.627 K triple point; true heat there 1462.8 J/mol, their estimate).
//        Scaling by the real-gas factor that turns the same formula's D2 result (1347) into the measured 1226 J/mol
//        gives ~1377-1400 J/mol for T2, bracketing 1390. Measured NBP 24.92 K also reported (Jacobs, OSTI 4799828).
//Other sources: https://www.jpl.nasa.gov/news/herschel-to-complete-its-mission-soon/
//  https://pubchem.ncbi.nlm.nih.gov/compound/24824  https://pubchem.ncbi.nlm.nih.gov/compound/Deuterium  https://encyclopedia.airliquide.com/deuterium
//No sourced liquid conductivity found for T2 or He-3, so none is set (RF default; changes boiloff by <4%).
@RESOURCE_DEFINITION[LqdHe3]:FOR[RealismOverhaul]
{
	@unitCost = 4.281
	%vsp = 8620		//26 J/mol / 3.016 g/mol
}
@RESOURCE_DEFINITION[LqdTritium]:FOR[RealismOverhaul]
{
	@unitCost = 1168.5
	%vsp = 230400	//1390 J/mol / 6.032 g/mol
}
@RESOURCE_DEFINITION[LqdDeuterium]:FOR[RealismOverhaul]
{
	@unitCost = 0.04984
	%vsp = 304400	//1226 J/mol / 4.028 g/mol
	%conductivity = 0.126
}

