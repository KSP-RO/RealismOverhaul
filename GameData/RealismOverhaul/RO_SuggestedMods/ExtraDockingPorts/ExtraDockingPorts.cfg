@PART[ExtraDockingPorts-MediumDockingPort]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True

	// X = 3.733 (7.0m diameter)
	// Y = 1.866 (50% squashed height relative to the 7m diameter)
	// Z = 3.733 (7.0m diameter)
	@MODEL
	{
		%scale = 3.733, 1.866, 3.733
	}

	@NODE[Top]
	{
		%size = 7
	}
	@NODE[Bottom]
	{
		%size = 7
	}

	@title = 7.0m Low-Profile Heavy Duty Docking Mechanism
	@manufacturer = Generic RO
	@description = A low-profile, 7.0-meter reinforced docking mechanism designed for heavy orbital structures.
	%mass = 1.25
	%crashTolerance = 12
	%maxTemp = 1073.15
	%skinMaxTemp = 1773.15
	%bulkheadProfiles = size7, srf
	%physicsMode = 0
	!MODULE[ModuleCargoPart] {}
	@MODULE[ModuleDockingNode]
	{
		@nodeType = 7mDockingPort
		%acquireForce = 15.0
		%acquireTorque = 5.0
		%captureMinThreshold = 0.2
	}
}