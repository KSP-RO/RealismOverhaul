@PART[ExtraDockingPorts-MediumDockingPort]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True

	// X = 3.733 (7.0m diameter)
	// Y = 1.866 (50% squashed height relative to the 7m diameter)
	// Z = 3.733 (7.0m diameter)
	@MODEL
	{
		%scale = 3.733, 1.866, 3.733
	}

	@NODE[Top]
	{
		%size = 7
	}
	@NODE[Bottom]
	{
		%size = 7
	}

	@title = 7.0m Low-Profile Heavy Duty Docking Mechanism
	@manufacturer = Generic RO
	@description = A low-profile, 7.0-meter reinforced docking mechanism designed for heavy orbital structures.
	%mass = 1.25
	%crashTolerance = 12
	%maxTemp = 1073.15
	%skinMaxTemp = 1773.15
	%bulkheadProfiles = size7, srf
	%physicsMode = 0
	!MODULE[ModuleCargoPart] {}
	@MODULE[ModuleDockingNode]
	{
		@nodeType = 7mDockingPort
		%acquireForce = 15.0
		%acquireTorque = 5.0
		%captureMinThreshold = 0.2
	}
}

// 5m variant. Copied from the 7m config above, so only size-dependent values change.
// Model scale = diameter / 1.875 (stock size1p5 model), height squashed to 50%.
// Mass scales with diameter squared from the 7m part (1.25 t).
+PART[ExtraDockingPorts-MediumDockingPort]:NEEDS[RealismOverhaul]
{
	@name = ExtraDockingPorts-MediumDockingPort-5m
	@MODEL
	{
		@scale = 2.6667, 1.3333, 2.6667
	}
	@NODE[Top]
	{
		@size = 5
	}
	@NODE[Bottom]
	{
		@size = 5
	}
	@title = 5m Low-Profile Heavy Duty Docking Mechanism
	@description = A low-profile, 5-meter reinforced docking mechanism designed for heavy orbital structures. Only docks with other 5m ports.
	@mass = 0.64
	@bulkheadProfiles = size5, srf
	@MODULE[ModuleDockingNode]
	{
		@nodeType = 5mDockingPort
	}
}


