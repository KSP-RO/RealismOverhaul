    //Rebuilt as a patch of FFT's own engine instead of deleting it. The old version removed ModuleFusionEngine (no charge-up,
    //no reactor link), the B9 switch and the heat link, used a non-existent module name (ModuleMultiModeEngine) and
    //non-existent effect names. UNTESTED in game: check both modes ignite after charging.

    //1) copy native engine + heat module for the second mode BEFORE patching either
    +MODULE[ModuleEnginesFX]:HAS[#engineID[D-He3]]
    {
        @engineID = DT-LH2
    }
    +MODULE[ModuleSystemHeatEngine]:HAS[#engineModuleID[D-He3]]
    {
        @engineModuleID = DT-LH2
        %moduleID = engine2
    }

    //2) Mode 1: D-3He cruise
    @MODULE[ModuleEnginesFX]:HAS[#engineID[D-He3]]
    {
        @minThrust = 0
        @maxThrust = 1850
        !PROPELLANT,* {}
        PROPELLANT
        {
            name = LqdDeuterium
            ratio = 0.266486
            DrawGauge = True
        }
        PROPELLANT
        {
            name = LqdHe3
            ratio = 0.733514
            DrawGauge = True
        }
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 18500
            key = 1 12500	//aerospike altitude compensation
        }
    }

    //3) Mode 2: D-T + LH2 liftoff
    @MODULE[ModuleEnginesFX]:HAS[#engineID[DT-LH2]]
    {
        @minThrust = 0
        @maxThrust = 6500
        !PROPELLANT,* {}
        PROPELLANT
        {
            name = LqdDeuterium
            ratio = 0.00896608
            DrawGauge = True
        }
        PROPELLANT
        {
            name = LqdTritium
            ratio = 0.00455028
            DrawGauge = True
        }
        PROPELLANT
        {
            name = LqdHydrogen
            ratio = 0.986484
            DrawGauge = True
        }
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 3800
            key = 1 2950
        }
    }

    MODULE
    {
        name = MultiModeEngine
        primaryEngineID = D-He3
        secondaryEngineID = DT-LH2
        primaryEngineModeDisplayName = D-3He Ananeutronic (Cruise)
        secondaryEngineModeDisplayName = D-T + LH2 Augmented (Liftoff)
    }

    @MODULE[ModuleSystemHeatEngine],*:NEEDS[SystemHeat]
    {
        @systemPower = 95000
    }
}
