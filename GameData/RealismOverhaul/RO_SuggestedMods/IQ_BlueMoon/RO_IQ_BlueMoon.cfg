
// ----------------------------------------------------------------------------
//  - Manufacturer         : Blue Origin
//  - Mission Profile      : 30-Day Human Lunar Lander / Cargo Delivery System
//  - Scale Factor         : 1.6x (Real-scale geometry alignment)
//  - Total Dry Mass       : 16.000 metric tons (16,000 kg / ~35,200 lbs)
//      * Habitat Module   : 6.000 t  (4-Crew / 30-Day Pressurized Cabin)
//      * Tank Section     : 8.800 t  (MLI-shielded Hydrolox Main Tank)
//      * Landing Gear     : 1.000 t  (4x 0.250 t Heavy Articulating Struts)
//      * BE-7 Engine      : 0.120 t  (44.5 kN Dual-Expander Hydrolox Engine)
//      * Av/IU & RCS Unit : 0.080 t  (GNC, TT&C, Active Cooling Loop)
//
//  - Total Wet Mass       : ~49.310 metric tons (49,310 kg / ~108,700 lbs)
//  - Main Propulsion      : 1x BE-7 Engine (LOX/LH2, Vacuum Isp 453s)
//  - Main Tank Capacity   : ~97,000 L Cryogenic (33,310 kg Propellant)
//      * LqdHydrogen      : 72,300 L (~5,120 kg)
//      * LqdOxygen        : 24,700 L (~28,190 kg)
//  - Vacuum Delta-V       : ~5,000 m/s (Direct LLO-Surface-LLO trajectory + margins)
//  - RCS System           : Hypergolic (MMH / MON3 / He Pressurant, 290s Vac Isp)
//  - Avionics & Comms     : Integrated Dual-Band (S-Band TT&C, X-Band High-Rate)
//
// Source:
// https://en.wikipedia.org/wiki/Blue_Moon_(spacecraft)
// https://www.blueorigin.com/fr-FR/news/be7-engine-testing
// https://www.blueorigin.com/fr-FR/blue-moon
// ============================================================================

@PART[IQBM_Tank]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    %rescaleFactor = 1.6

    @mass = 8.8

    @maxTemp = 1200
    @skinMaxTemp = 2000
    %manufacturer = Blue Origin
    %description = Main cryogenic propellant tank for the Blue Moon Lunar Lander.

    !RESOURCE[*],* {}
    !MODULE[ModuleFuelTanks],* {}

    MODULE
    {
        name = ModuleFuelTanks
        volume = 97000
        type = Cryogenic
        utilization = 100
        typeAvailable = Cryogenic

        TANK
        {
            name = LqdHydrogen
            amount = 72300
            maxAmount = 72300
        }
        TANK
        {
            name = LqdOxygen
            amount = 24700
            maxAmount = 24700
        }
    }
}

@PART[IQ_BE-7]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    %rescaleFactor = 1.6
    @mass = 0.12
    @maxTemp = 900
    @skinMaxTemp = 1600
    
    %engineType = BE-7
}

@PART[IQBM_Leg]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    %rescaleFactor = 1.6
    @mass = 0.25
    @maxTemp = 900
    @skinMaxTemp = 1200
    %manufacturer = Blue Origin
    %description = Heavy-duty, articulating landing gear specifically engineered for the Blue Moon architecture. Designed to absorb high impact energy on uneven lunar regolith while keeping the engine bell well clear of surface obstructions.
    @crashTolerance = 19
    %breakingForce = 270
    %breakingTorque = 270
}

@PART[IQBM_IU]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    %rescaleFactor = 1.6

    @mass = 0.08

    @maxTemp = 700
    @skinMaxTemp = 1200
    %manufacturer = Blue Origin
    %description = Flight computer, GNC bay, and active thermal management unit for the Blue Moon lander. Features integrated RCS thrusters and an active radiator thermal loop designed to prevent LH2/LOX boil-off during multi-week surface stays.

    !MODULE[ModuleCommand],* {}
    !MODULE[ModuleSAS],* {}
    !MODULE[ModuleRCS*],* {}
    !MODULE[ModuleActiveRadiator],* {}
    !MODULE[ModuleDataTransmitter*],* {}
    !RESOURCE[ElectricCharge],* {}

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 
        }
    }

    MODULE
    {
        name = ModuleRealAntenna
        referenceGain = 3.0
        RFBand = S
        TxPower = 30
    }

    MODULE
    {
        name = ModuleRealAntenna
        antennaDiameter = 0.8
        RFBand = X
        TxPower = 37
    }

    MODULE
    {
        name = ModuleActiveRadiator
        maxEnergyTransfer = 25000 
        overcoolFactor = 0.25
        isStartActive = true
        headroom = 100
        
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.25
        }
    }

    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = rcsTransform
        thrusterPower = 0.111
        resourceFlowMode = STAGE_PRIORITY_FLOW

        PROPELLANT
        {
            name = MMH
            ratio = 0.48
            DrawGauge = True
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.52
        }
        PROPELLANT
        {
            name = Helium
            ratio = 15.0
            ignoreForIsp = True
        }

        atmosphereCurve
        {
            key = 0 290
            key = 1 100
        }
    }
}

@PART[IQBM_Hab]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    %rescaleFactor = 1.6
    @mass = 6.0 
    %CrewCapacity = 4
    @maxTemp = 750
    @skinMaxTemp = 1400
    %manufacturer = Blue Origin
    %description = Long-duration pressurized habitat and command module for the Blue Moon lander. Includes expanded life support, thermal control systems, and communication equipment capable of sustaining a crew of four for up to 30 days on the lunar surface.

    !MODULE[ModuleDataTransmitter*],* {}
    !MODULE[ModuleReactionWheel],* {}
    !MODULE[ModuleFuelTanks],* {}
    !MODULE[ModuleResourceConverter*],* {}
    !RESOURCE[*],* {}

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 1
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.2 
        }
    }

    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Hydrolox Fuel Cell
        StartActionName = Start Fuel Cell
        StopActionName = Stop Fuel Cell
        ToggleActionName = Toggle Fuel Cell
        FillAmount = 0.95
        AutoShutdown = false
        GeneratesHeat = true
        DefaultShutoffTemp = 0.8
        UseSpecialistBonus = false

        INPUT_RESOURCE
        {
            ResourceName = LqdHydrogen
            Ratio = 0.0002821 
            FlowMode = STAGE_PRIORITY_FLOW
        }
        INPUT_RESOURCE
        {
            ResourceName = LqdOxygen
            Ratio = 0.0001402 
            FlowMode = STAGE_PRIORITY_FLOW
        }

        OUTPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 1.5 
            DumpExcess = false
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Water
            Ratio = 0.0000001788 
            DumpExcess = true 
        }
    }
    
    MODULE
    {
        name = ModuleFuelTanks
        volume = 300000 
        type = ServiceModule
        
        TANK
        {
            name = ElectricCharge
            amount = 150000
            maxAmount = 150000
        }
        TANK
        {
            name = Food
            amount = 900
            maxAmount = 900
        }
        TANK
        {
            name = Water
            amount = 500
            maxAmount = 500
        }
        TANK
        {
            name = Oxygen
            amount = 160000 
            maxAmount = 160000
        }
        TANK
        {
            name = Nitrogen
            amount = 130000 
            maxAmount = 130000
        }
        TANK
        {
            name = LithiumHydroxide
            amount = 120
            maxAmount = 120
        }
        TANK
        {
            name = CarbonDioxide
            amount = 0
            maxAmount = 25000
        }
        TANK
        {
            name = Waste
            amount = 0
            maxAmount = 150
        }
        TANK
        {
            name = WasteWater
            amount = 0
            maxAmount = 400
        }
        TANK
        {
            name = MMH
            amount = 120
            maxAmount = 120
        }
        TANK
        {
            name = MON3
            amount = 130
            maxAmount = 130
        }
        TANK
        {
            name = Helium
            amount = 4000
            maxAmount = 4000
        }
    }

    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = rcsTransform 
        !resourceName = DELETE
        thrusterPower = 0.111
        resourceFlowMode = STAGE_PRIORITY_FLOW

        PROPELLANT
        {
            name = MMH
            ratio = 0.48
            DrawGauge = True
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.52
        }
        PROPELLANT
        {
            name = Helium
            ratio = 15.0
            ignoreForIsp = True
        }

        atmosphereCurve
        {
            key = 0 290 
            key = 1 100
        }
    }
}