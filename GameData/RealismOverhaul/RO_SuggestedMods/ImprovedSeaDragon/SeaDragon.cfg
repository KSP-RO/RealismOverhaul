// Sources: Wikipedia "Sea Dragon (rocket)", Astronautix "Sea Dragon"
// Gross mass ~18,000-18,143 t, payload 550 t, 8 mm maraging steel hull
//	(1) https://en.wikipedia.org/wiki/Sea_Dragon_(rocket)
//	(2) http://www.astronautix.com/s/seadragon.html
// ---------------------------------------------------------------
// STAGE 1 TANK  (RP-1 / LOX)
// ---------------------------------------------------------------
@PART[SDFirstTank]:FOR[ImprovedSeaDragon]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6
	@title = Sea Dragon First Stage Fuel Tank
	@manufacturer = NASA
	@description = Gargantuan first stage tank with enough fuel to propel the Sea Dragon far into the upper atmosphere


	@maxTemp = 1200
	%skinMaxTemp = 2500 // reantry
	%emissiveConstant = 0.6
	%thermalMassModifier = 1.0
	%skinMassPerArea = 4	

	@mass = 919.076		// ~2,026,215 lb dry, incl. pressurizing gases

	@NODE,* { @size = 10 }

	!RESOURCE,*{}

	!MODULE[ModuleFuelTanks]{}

	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		type = Fuselage
		volume = 11240788	

		// 7,991,194 kg LOX -> 7,003,676 L
		TANK
		{
			name = LqdOxygen
			amount = 7003676
			maxAmount = 7003676
		}
		// 3,474,432 kg RP-1 -> 4,237,112 L
		TANK
		{
			name = Kerosene
			amount = 4237112
			maxAmount = 4237112
		}
	}
}

// ---------------------------------------------------------------
// STAGE 2 TANK  (LH2 / LOX) 
// ---------------------------------------------------------------
@PART[SDSecondTank]:FOR[ImprovedSeaDragon]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6
	@title = Sea Dragon Second Stage Cryogenic Tank
	@manufacturer = NASA
	@description = Cryogenic fuel tank for the Sea Dragon second stage



	@maxTemp = 500
	%skinMaxTemp = 500
	%emissiveConstant = 0.6
	%thermalMassModifier = 1.0
	%skinMassPerArea = 4	

	@mass = 386.265		

	@NODE,* { @size = 8 }
	@NODE[connect0*] { @size = 3 }

	!RESOURCE,*{}
	!MODULE[ModuleFuelTanks]{}

	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		type = Fuselage
		volume = 14406934

		// 3,631,027 + 263,480 kg LOX -> 3,182,320 + 230,920 L
		TANK
		{
			name = LqdOxygen
			amount = 3413240
			maxAmount = 3413240
		}
		// 726,205 + 52,700 kg LH2 -> 10,249,894 + 743,800 L
		TANK
		{
			name = LqdHydrogen
			amount = 10993694
			maxAmount = 10993694
		}
	}
}
// ---------------------------------------------------------------
// ENGINES
// ---------------------------------------------------------------
@PART[SDEngine1|SDEngine2]:FOR[RealismOverhaul]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6
	@maxTemp = 1000
	%skinMaxTemp = 1000
	%emissiveConstant = 0.6
	%thermalMassModifier = 1.0
	%skinMassPerArea = 4
}
@PART[SDEngine1]:FOR[RealismOverhaul]:NEEDS[RealismOverhaul]
{
	@NODE,* { @size = 10 }
	@mass = 288.303
	%engineType = SeaDragonS1
}
@PART[SDEngine2]:FOR[RealismOverhaul]:NEEDS[RealismOverhaul]
{
	@NODE,* { @size = 8 }
	@mass = 70.044
	%engineType = SeaDragonS2
}
