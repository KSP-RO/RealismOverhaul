//	==========================================================================
//	Kate's Greebles (Windows)
//	==========================================================================
//	Shared settings + size switch
//	Scales the window shapes in-plane only (X/Z). Y is the attach axis, so the
//	window stays seated on the hull at every size. Mass scales with area (set per part below).
@PART[windowsmall|windowmedium]:FOR[RealismOverhaul]:NEEDS[KatesGreebles,B9PartSwitch]
{
	%RSSROConfig = True
	%PhysicsSignificance = 1
	%maxTemp = 1000
	%skinMaxTemp = 1000
	%skinTempTag = Aluminum
	%internalTempTag = Instruments
	@manufacturer = Generic  // comon those are just windows, not a specific manufacturer

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = sizeSwitch
		switcherDescription = Size
		switchInFlight = false

		SUBTYPE
		{
			name = 50
			title = 50%
			TRANSFORM
			{
				name = windowsmallcircle
				scaleOffset = 0.5, 1, 0.5
			}
			TRANSFORM
			{
				name = windowsmallairlineroval
				scaleOffset = 0.5, 1, 0.5
			}
			TRANSFORM
			{
				name = windowsmallairliner
				scaleOffset = 0.5, 1, 0.5
			}
			TRANSFORM
			{
				name = windowsmallrectangle
				scaleOffset = 0.5, 1, 0.5
			}
			TRANSFORM
			{
				name = windowsmallsquare
				scaleOffset = 0.5, 1, 0.5
			}
			TRANSFORM
			{
				name = windowsmalltriangle
				scaleOffset = 0.5, 1, 0.5
			}
			TRANSFORM
			{
				name = windowsmalltriangletall
				scaleOffset = 0.5, 1, 0.5
			}
			TRANSFORM
			{
				name = windowsmalltrapezoid
				scaleOffset = 0.5, 1, 0.5
			}
		}

		SUBTYPE
		{
			name = 75
			title = 75%
			TRANSFORM
			{
				name = windowsmallcircle
				scaleOffset = 0.75, 1, 0.75
			}
			TRANSFORM
			{
				name = windowsmallairlineroval
				scaleOffset = 0.75, 1, 0.75
			}
			TRANSFORM
			{
				name = windowsmallairliner
				scaleOffset = 0.75, 1, 0.75
			}
			TRANSFORM
			{
				name = windowsmallrectangle
				scaleOffset = 0.75, 1, 0.75
			}
			TRANSFORM
			{
				name = windowsmallsquare
				scaleOffset = 0.75, 1, 0.75
			}
			TRANSFORM
			{
				name = windowsmalltriangle
				scaleOffset = 0.75, 1, 0.75
			}
			TRANSFORM
			{
				name = windowsmalltriangletall
				scaleOffset = 0.75, 1, 0.75
			}
			TRANSFORM
			{
				name = windowsmalltrapezoid
				scaleOffset = 0.75, 1, 0.75
			}
		}

		SUBTYPE
		{
			name = 100
			title = 100%
			defaultSubtypePriority = 1
		}

		SUBTYPE
		{
			name = 150
			title = 150%
			TRANSFORM
			{
				name = windowsmallcircle
				scaleOffset = 1.5, 1, 1.5
			}
			TRANSFORM
			{
				name = windowsmallairlineroval
				scaleOffset = 1.5, 1, 1.5
			}
			TRANSFORM
			{
				name = windowsmallairliner
				scaleOffset = 1.5, 1, 1.5
			}
			TRANSFORM
			{
				name = windowsmallrectangle
				scaleOffset = 1.5, 1, 1.5
			}
			TRANSFORM
			{
				name = windowsmallsquare
				scaleOffset = 1.5, 1, 1.5
			}
			TRANSFORM
			{
				name = windowsmalltriangle
				scaleOffset = 1.5, 1, 1.5
			}
			TRANSFORM
			{
				name = windowsmalltriangletall
				scaleOffset = 1.5, 1, 1.5
			}
			TRANSFORM
			{
				name = windowsmalltrapezoid
				scaleOffset = 1.5, 1, 1.5
			}
		}

		SUBTYPE
		{
			name = 200
			title = 200%
			TRANSFORM
			{
				name = windowsmallcircle
				scaleOffset = 2, 1, 2
			}
			TRANSFORM
			{
				name = windowsmallairlineroval
				scaleOffset = 2, 1, 2
			}
			TRANSFORM
			{
				name = windowsmallairliner
				scaleOffset = 2, 1, 2
			}
			TRANSFORM
			{
				name = windowsmallrectangle
				scaleOffset = 2, 1, 2
			}
			TRANSFORM
			{
				name = windowsmallsquare
				scaleOffset = 2, 1, 2
			}
			TRANSFORM
			{
				name = windowsmalltriangle
				scaleOffset = 2, 1, 2
			}
			TRANSFORM
			{
				name = windowsmalltriangletall
				scaleOffset = 2, 1, 2
			}
			TRANSFORM
			{
				name = windowsmalltrapezoid
				scaleOffset = 2, 1, 2
			}
		}

		SUBTYPE
		{
			name = 300
			title = 300%
			TRANSFORM
			{
				name = windowsmallcircle
				scaleOffset = 3, 1, 3
			}
			TRANSFORM
			{
				name = windowsmallairlineroval
				scaleOffset = 3, 1, 3
			}
			TRANSFORM
			{
				name = windowsmallairliner
				scaleOffset = 3, 1, 3
			}
			TRANSFORM
			{
				name = windowsmallrectangle
				scaleOffset = 3, 1, 3
			}
			TRANSFORM
			{
				name = windowsmallsquare
				scaleOffset = 3, 1, 3
			}
			TRANSFORM
			{
				name = windowsmalltriangle
				scaleOffset = 3, 1, 3
			}
			TRANSFORM
			{
				name = windowsmalltriangletall
				scaleOffset = 3, 1, 3
			}
			TRANSFORM
			{
				name = windowsmalltrapezoid
				scaleOffset = 3, 1, 3
			}
		}
	}
}


//	Small Window
@PART[windowsmall]:FOR[RealismOverhaul]:NEEDS[KatesGreebles]
{
	@title = Small Viewport Window
	@description = A small pressure-rated viewport set into a hull wall. Several frame shapes, paint colours and sizes are available.
	%mass = 0.005
}

//	Medium Window
@PART[windowmedium]:FOR[RealismOverhaul]:NEEDS[KatesGreebles]
{
	@title = Medium Viewport Window
	@description = A larger pressure-rated viewport set into a hull wall. Several frame shapes, paint colours and sizes are available.
	%mass = 0.015
}


//	Size switch mass: base mass x (scale^2 - 1)

@PART[windowsmall]:AFTER[RealismOverhaul]:NEEDS[KatesGreebles,B9PartSwitch]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[sizeSwitch]]
	{
		@SUBTYPE[50] { %addedMass = -0.00375 }
		@SUBTYPE[75] { %addedMass = -0.0021875 }
		@SUBTYPE[150] { %addedMass = 0.00625 }
		@SUBTYPE[200] { %addedMass = 0.015 }
		@SUBTYPE[300] { %addedMass = 0.04 }
	}
}

@PART[windowmedium]:AFTER[RealismOverhaul]:NEEDS[KatesGreebles,B9PartSwitch]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[sizeSwitch]]
	{
		@SUBTYPE[50] { %addedMass = -0.01125 }
		@SUBTYPE[75] { %addedMass = -0.0065625 }
		@SUBTYPE[150] { %addedMass = 0.01875 }
		@SUBTYPE[200] { %addedMass = 0.045 }
		@SUBTYPE[300] { %addedMass = 0.12 }
	}
}
