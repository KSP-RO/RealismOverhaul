// F-104 Starfighter Cockpit
@PART[MPR_Cockpit_F104]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    @title = F-104 Starfighter Cockpit
    @manufacturer = Lockheed
    @description = Single seat, supersonic jet fighter cockpit.
    %rescaleFactor = 1.16

    @mass = 0.4 // 95kg ejection seat + ASG-114 (120kg) + structure, so rounded up to 500 kg
    @crashTolerance = 8
    @breakingForce = 2000
    @breakingTorque = 2000
    
    %skinTempTag = Aluminum
    %internalTempTag = Instruments
    
    @MODULE[ModuleCommand]
    {
        RESOURCE
        {
            name = ElectricCharge
            rate = 1.0
        }
    }
    !RESOURCE[ElectricCharge] {}
    
    MODULE
    {
        name = ModuleFuelTanks
        type = Fuselage
        basemass = -1
        volume = 120
        TANK
        {
            name = ElectricCharge
            amount = 10800
            maxAmount = 10800
        }
        UNMANAGED_RESOURCE
        {
            name = Oxygen
            amount = 50
            maxAmount = 50
        }
        TANK
        {
            name = Water
            amount = 2
            maxAmount = 2
        }
        TANK
        {
            name = Food
            amount = 1
            maxAmount = 1
        }
    }
    MODULE
    {
        name = ModuleSAS
    }
    !INTERNAL,* {}
    INTERNAL
    {
        name = RO-Mk1CockpitInternal-1.25
        offset = 0.0, 0.2, -1.95
    }
    MODULE
    {
        name = ModuleROEjectionSeat
        mass = 0.1

        SEAT
        {
            colliderOffset = 0.0, 2.45, -1.2
            colliderRotAngles = -90.0, 0.0, 0.0
            forceDir = 0.0, 0.15, -1.0
        }
    }
}