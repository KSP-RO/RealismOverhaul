// F-4 Phantom II Cockpit
@PART[MPR_Cockpit_F4]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    @title = F-4 Phantom II Cockpit
    @manufacturer = McDonnell Douglas
    @description = Twin seat, supersonic cockpit.
    %rescaleFactor = 1.2 

    @mass = 0.6 // 2x 200kg ejection + AWG-10 (300kg) + LS + structure, rounded up 
    @crashTolerance = 8
    @breakingForce = 2000
    @breakingTorque = 2000
    
    %skinTempTag = Aluminum
    %internalTempTag = Instruments
    
    @MODULE[ModuleCommand]
    {
        RESOURCE
        {
            name = ElectricCharge
            rate = 1.25 // Larger avionics & radar
        }
    }
    !RESOURCE[ElectricCharge] {}
    
    MODULE
    {
        name = ModuleFuelTanks
        type = Fuselage
        basemass = -1
        volume = 120
        TANK
        {
            name = ElectricCharge
            amount = 21600
            maxAmount = 21600
        }
        UNMANAGED_RESOURCE
        {
            name = Oxygen
            amount = 100
            maxAmount = 100
        }
        TANK
        {
            name = Water
            amount = 4
            maxAmount = 4
        }
        TANK
        {
            name = Food
            amount = 2
            maxAmount = 2
        }
    }
    MODULE
    {
        name = ModuleSAS
    }
    !INTERNAL,* {}
    INTERNAL
    {
        name = rofighterinlineInternal
        offset = 0.0, -0.5, -1.75
    }
    MODULE
    {
        name = ModuleROEjectionSeat
        mass = 0.4

        SEAT
        {
            colliderOffset = 0.0, 2.25, -0.95
            colliderRotAngles = -90.0, 0.0, 0.0
            forceDir = 0.0, 0.15, -1.0
        }

        SEAT
        {
            colliderOffset = 0.0, 1.1, -0.95
            colliderRotAngles = -90.0, 0.0, 0.0
            forceDir = 0.0, 0.15, -1.0
        }
    }
}