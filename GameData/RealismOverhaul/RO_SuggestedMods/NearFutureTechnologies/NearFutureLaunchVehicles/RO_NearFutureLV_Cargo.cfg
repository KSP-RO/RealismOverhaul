// ----------------------------------------------------------------------------------------
// Standard Unpressurized Fairings vs. Reusable Cargo Bays:
// Non-reusable composite payload fairings (e.g., Falcon 9) average ~14.5 kg/m^2. Reusable
// atmospheric entry bays add significant overhead due to long-axis door hinges, motor 
// actuators, ring frame reinforcement, and TPS skin, pushing target density to ~28 kg/m^2 
// for cylindrical bays and ~35 kg/m^2 for apex-reinforced nose bays.
//
// Part Name            | Diameter | Length  | Shell Area  | Mass Formula Target | Calculated Mass
// ---------------------|----------|---------|-------------|---------------------|----------------
// nflv-cargo-5-1       | 5.0 m    | 15.0 m  | ~235.62 m^2 | 28.0 kg/m^2         | 6.60 t
// nflv-cargo-5-2       | 5.0 m    | 7.5 m   | ~117.81 m^2 | 28.0 kg/m^2         | 3.30 t
// nflv-cargo-5-3       | 5.0 m    | 3.75 m  | ~58.90 m^2  | 28.0 kg/m^2         | 1.65 t
// nflv-cargo-5-4       | 5.0 m    | 1.875 m | ~29.45 m^2  | 28.0 kg/m^2         | 0.82 t
// nflv-cargo-nose-5-1  | 5.0 m    | 5.89 m  | ~50.30 m^2  | 35.0 kg/m^2         | 1.76 t
// nflv-cargo-75-1      | 7.5 m    | 15.0 m  | ~353.43 m^2 | 28.0 kg/m^2         | 9.90 t
// nflv-cargo-75-2      | 7.5 m    | 7.5 m   | ~176.71 m^2 | 28.0 kg/m^2         | 4.95 t
// nflv-cargo-75-3      | 7.5 m    | 3.75 m  | ~88.36 m^2  | 28.0 kg/m^2         | 2.47 t
// nflv-cargo-75-4      | 7.5 m    | 1.875 m | ~44.18 m^2  | 28.0 kg/m^2         | 1.24 t
// nflv-cargo-nose-75-1 | 7.5 m    | 5.33 m  | ~76.75 m^2  | 35.0 kg/m^2         | 2.69 t
// ========================================================================================

// --------------------------------------------------------
// 5m Cargo Bay - Full
// --------------------------------------------------------
@PART[nflv-cargo-5-1]:FOR[RealismOverhaul] 
{
    %RSSROConfig = True
    @mass = 6.60
    @crashTolerance = 12
    @breakingForce = 250
    @breakingTorque = 250
    @maxTemp = 3600
    %skinMaxTemp = 3600
    %emissivity = 0.9
    %heatConductivity = 0.01
    %skinInternalConductionMult = 0.25
    %skinSkinConductionMult = 0.1
    %skinMassPerArea = 4.0
}

