//  ==================================================
//  Concorde Passenger Segment
//
//  Realism Overhaul configuration.
//  ==================================================
@PART[25PC]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@title = Narrowbody Passenger Module (4 abreast)
	@manufacturer = Sud Aviation
	@description =  Narrowbody passenger module. 10 rows of seating in a 2-2 configuration, with a 3.1m external diameter.
	@mass = 4 //entirely a guess...
	@rescaleFactor = 1.24
	%vesselType = Plane
	//Aluminum
	%skinTempTag = Aluminum
	%internalTempTag = Instruments

	@INTERNAL[kossakint]
	{
		%offset = 0 , 2.0 , -1.75
	}
}

