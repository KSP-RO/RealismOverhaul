@PART[PROXI-DCY-nose]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    @rescaleFactor = 0.802

    @title = DC-Y Nose Section
    %manufacturer = #roMfrMD
    @description = The aerodynamic nose section of the DC-Y. It contains primary RCS thrusters, auxiliary fuel tanks, and is fully tiled with High-Temperature Reusable Surface Insulation (HRSI) for atmospheric reentry.

    @mass = 8.5

    %skinTempTag = HRSI
    %internalTempTag = HotStructure
    %skinTempOverride = 2700
    %paintEmissivityTag = 0.95

    !RESOURCE[*],* {}

    @MODULE[ModuleRCS*]
    {
        @name = ModuleRCSFX
        @thrusterPower = 0.5 
        @stagingEnabled = True
        
        !resourceName = DELETE
        !PROPELLANT[*],* {}

        PROPELLANT
        {
            name = MMH
            ratio = 0.4943
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.5057
        }
        PROPELLANT
        {
            name = Helium
            ratio = 12.9
            ignoreForIsp = true
        }
        
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 340
            key = 1 110
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        type = ServiceModule
        volume = 50000
        basemass = -1

        TANK
        {
            name = LqdHydrogen
            amount = 34846
            maxAmount = 34846
        }
        TANK
        {
            name = LqdOxygen
            amount = 12954
            maxAmount = 12954
        }
        TANK
        {
            name = MMH
            amount = 1000
            maxAmount = 1000
        }
        TANK
        {
            name = MON3
            amount = 1000
            maxAmount = 1000
        }
        TANK
        {
            name = Helium
            amount = 25000
            maxAmount = 25000
        }
    }
}

