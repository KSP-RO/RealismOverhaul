// ============================================================================
// DC-Y engine plumes (ROWaterfall)
//
// PLANA rescales these parts by 0.5938, RO by 0.802. Waterfall scales are not inherited from the
// part's rescaleFactor, so every scale here is PLANA's own Waterfall scale * 1.3506 (0.802 / 0.5938).
// ============================================================================

// Aerospike
@PART[PROXI-DCY-Spike]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    // PLANA's own plume switch edits a Waterfall module that ROWaterfall replaces;
    // the same choice is the "individual" MainPlumeVariant below.
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[DCYSpikeplumeSwitch]] {}

    ROWaterfall
    {
        engineID = DCY_Spike
        template = waterfall-hydrolox-lower-1
        audio = pump-fed-very-heavy-1
        defaultMainPlumeVariantName = full
        transform = zzz_FX_DCY_AerospikeFull
        position = 0, 0, -0.03
        rotation = 0, 0, 0
        scale = 4.93, 4.93, 1.35
        MainPlumeVariant
        {
            name = individual
            template = waterfall-hydrolox-lower-4
            transform = FX_DCY_AerospikeIndiv
            position = 0, 0, 0
            rotation = 0, 0, 0
            scale = 0.135, 0.135, 0.135
        }
    }
    @MODULE[ModuleEngines*]
    {
        %runningEffectName = running
    }
}

// Sea level bell
@PART[PROXI-DCY-SL]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        engineID = DCY_SL
        template = waterfall-hydrolox-lower-4
        audio = pump-fed-medium-1
        transform = thrustTransform
        position = 0, 0, 0
        rotation = 0, 0, 0
        scale = 0.945, 0.945, 1.35
    }
    @MODULE[ModuleEngines*]
    {
        %runningEffectName = running
        !powerEffectName = DELETE
    }
}

// Bimodal bell: nozzle retracted (sea level) / extended (vacuum)
@PART[PROXI-DCY-VAC]:BEFORE[ROWaterfall]:NEEDS[Waterfall]
{
    ROWaterfall
    {
        engineID = DCY_VAC-SL
        template = waterfall-hydrolox-lower-4
        audio = pump-fed-medium-1
        defaultMainPlumeVariantName = retracted
        transform = fxTransformSL
        position = 0, 0, 0
        rotation = 0, 0, 0
        scale = 0.945, 0.945, 1.35
        MainPlumeVariant
        {
            name = extended
            template = waterfall-hydrolox-lower-4
            transform = fxTransformVAC
            position = 0, 0, 0
            rotation = 0, 0, 0
            scale = 1.215, 1.215, 1.35
        }
    }
    @MODULE[ModuleEngines*]
    {
        %runningEffectName = running
        !powerEffectName = DELETE
    }

    // The extended-nozzle SUBCONFIG switches to the extended plume
    @MODULE[ModuleBimodalEngineConfigs]:NEEDS[B9PartSwitch]
    {
        @CONFIG,*
        {
            @SUBCONFIG,*
            {
                LinkB9PSModule
                {
                    name = rowaterfallMainPlumeSwitch
                    subtype = extended
                }
            }
        }
    }
}
