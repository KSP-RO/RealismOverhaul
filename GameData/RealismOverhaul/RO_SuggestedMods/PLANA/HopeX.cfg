@PART[PROXI-HopeX-nose]:FOR[RealismOverhaul]
{
    @mass = 2.5
    @title = HOPE-X Nose
    @description = Nose for HOPE-X, also the flight computer. 
    
    !RESOURCE[*],* {}
    !MODULE[ModuleReactionWheel*],*{}

    MODULE
    {
        name = ModuleFuelTanks
        volume = 5000
        basemass = -1
        type = ServiceModule
        
        TANK
        {
            name = ElectricCharge
            amount = 5000.0
            maxAmount = 5000.0
        }
    }

    @MODULE[ModuleRCS*]
    {
        @name = ModuleRCSFX
        @thrusterPower = 0.6

        !resourceName = DELETE
        !PROPELLANT[*],* {}

        PROPELLANT
        {
            name = MMH
            ratio = 0.5078
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.4922
        }
        PROPELLANT
        {
            name = Helium
            ratio = 12.9
            ignoreForIsp = True
        }
        
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 300
            key = 1 100
        }
    }
}

