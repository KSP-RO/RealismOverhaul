@PART[PROXI-MDX33-*]:FOR[RealismOverhaul]
{
    %maxTemp = 923.15
    %skinMaxTemp = 3000
    %skinThermalMassModifier = 0.43613
    %skinInternalConductionMult = 0.0000105
    %skinMassPerArea = 0.815
    %absorptiveConstant = 0.15
    %emissiveConstant = 0.85
    %thermalMassModifier = 1.0

    %RSSROConfig = True
    @rescaleFactor = 1.0

    @manufacturer = #roMfrMD

    &tags = 
    @tags ^= :$: McDonnell Douglas X-33 RLV VTVL Delta Clipper:
}

@PART[PROXI-MDX33-Nose]:FOR[RealismOverhaul]
{
    @mass = 7.5
    @title = McDonnell Douglas X-33 Nose
    @description = Forward section for the McDonnell Douglas X-33 proposal. MMH + MON3 Tanks are set to empty in case LH2/LOX RCS is used.

    !RESOURCE[*],* {}
    !MODULE[ModuleReactionWheel*],* {}

    @MODULE[ModuleCommand]
    {
        @minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.8
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 123000
        basemass = -1
        type = ServiceModule

        TANK
        {
            name = ElectricCharge
            amount = 40000
            maxAmount = 40000
        }
        TANK
        {
            name = MMH
            amount = 0
            maxAmount = 1450
        }
        TANK
        {
            name = MON3
            amount = 0
            maxAmount = 1400
        }
        TANK
        {
            name = Helium
            amount = 0
            maxAmount = 22000
        }
        TANK
        {
            name = LqdOxygen
            amount = 32573
            maxAmount = 32573
        }
        TANK
        {
            name = LqdHydrogen
            amount = 87427
            maxAmount = 87427
        }
    }
}

