@PART[PROXI-MDX33-RCS]:FOR[RealismOverhaul]
{
    @mass = 0.08
    @title = McDonnell Douglas X-33 RCS Thruster Module
    @description = RCS for the McDonnel Douglas X-33.

    // Remove the stock/CryoTanks B9 resource switcher
    !MODULE[ModuleB9PartSwitch]:HAS[@SUBTYPE:HAS[@MODULE:HAS[@IDENTIFIER:HAS[#name[ModuleRCS*]]]]] {}

    @MODULE[ModuleRCS*]
    {
        @name = ModuleRCSFX
        @stagingEnabled = True
        @thrusterPower = 2.0
        !resourceName = DELETE
        !PROPELLANT[*],* {}

        PROPELLANT
        {
            name = LqdHydrogen
            ratio = 0.7286
        }
        PROPELLANT
        {
            name = LqdOxygen
            ratio = 0.2714
        }

        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 380
            key = 1 180
        }
    }

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCSFX
        thrustRating = thrusterPower
        origMass = 0.08
        configuration = Hydrolox

        CONFIG
        {
            name = Hydrolox
            thrusterPower = 2.0
            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.7286
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.2714
            }
            atmosphereCurve
            {
                key = 0 380
                key = 1 180
            }
        }
        CONFIG
        {
            name = MMH+MON3
            thrusterPower = 2.0
            PROPELLANT
            {
                name = MMH
                ratio = 0.5078
            }
            PROPELLANT
            {
                name = MON3
                ratio = 0.4922
            }
            PROPELLANT
            {
                name = Helium
                ratio = 12.9
                ignoreForIsp = True
            }
            atmosphereCurve
            {
                key = 0 300
                key = 1 110
            }
        }
    }
}