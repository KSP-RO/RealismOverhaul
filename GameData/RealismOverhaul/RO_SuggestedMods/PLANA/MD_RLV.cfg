@PART[PROXI-MDRLV-*]:FOR[RealismOverhaul]
{
	@rescaleFactor = 0.802

	%maxTemp = 923.15
	%skinMaxTemp = 3000
	%skinThermalMassModifier = 0.43613
	%skinInternalConductionMult = 0.0000105
	%skinMassPerArea = 0.815
	%absorptiveConstant = 0.15	
	%emissiveConstant = 0.85
	%thermalMassModifier = 1.0

	@manufacturer = McDonnell Douglas
	
	%RSSROConfig = True
}
@PART[PROXI-MDRLV-nose]:FOR[RealismOverhaul]
{
	@mass = 22.93
	@title = MD RLV Nose
	@description = The nose section of the MD RLV, covered in tiles to protect it during reentry.
	&tags =
	@tags ^= :$: MD RLV:
	
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	@RESOURCE[ElectricCharge]
	{
		@amount = 100000
		@maxAmount = 100000
	}
	MODULE
	{
		name = AdjustableCoMShifter
		DescentModeCoM = 0, 15.0, 0
	}
	!RESOURCE[*],* {}

	@MODULE[ModuleRCS*]
	{
		@name = ModuleRCSFX
		@thrusterPower = 0.5 
		@stagingEnabled = True

		!resourceName = DELETE
		!PROPELLANT[*],* {}	
		PROPELLANT
		{
			name = MMH
			ratio = 0.4943
		}
		PROPELLANT
		{
			name = MON3
			ratio = 0.5057
		}
		PROPELLANT
		{
			name = Helium
			ratio = 12.9
			ignoreForIsp = true
		}

		!atmosphereCurve {}
		atmosphereCurve
		{
			key = 0 340
			key = 1 110
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule 
		volume = 500000
		basemass = -1

		TANK
		{
			name = ElectricCharge
			amount = 10000
			maxAmount = 10000
		}
		TANK
		{
			name = LqdHydrogen
			amount = 344147
			maxAmount = 344147
		}
		TANK
		{
			name = LqdOxygen
			amount = 128843
			maxAmount = 128843
		}
		TANK
		{
			name = MMH
			amount = 1000
			maxAmount = 1000
		}
		TANK
		{
			name = MON3
			amount = 1000
			maxAmount = 1000
		}
		TANK
		{
			name = Helium
			amount = 25000
			maxAmount = 25000
		}
	}
}
