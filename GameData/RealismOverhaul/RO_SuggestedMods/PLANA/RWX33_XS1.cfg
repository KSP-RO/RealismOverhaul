@PART[PROXI-XS1-*]:FOR[RealismOverhaul]
{
    %maxTemp = 923.15
    %skinMaxTemp = 3000
    %skinThermalMassModifier = 0.43613
    %skinInternalConductionMult = 0.0000105
    %skinMassPerArea = 0.815
    %absorptiveConstant = 0.15
    %emissiveConstant = 0.85
    %thermalMassModifier = 1.0

    %RSSROConfig = True
    @rescaleFactor = 1.0

    @manufacturer = Rockwell International // or Boeing / DARPA for XS-1

    !MODULE[ModuleB9PartSwitch]:HAS[@SUBTYPE:HAS[#name[X33_Orbital]]] {}


    &tags = 
    @tags ^= :$: Rockwell X-33 XS-1 Phantom Express RLV spaceplane:
}

@PART[PROXI-XS1-Nose]:FOR[RealismOverhaul]
{
    @mass = 1.4
    @title = Rockwell X-33 Nose
    @description = Nose cone and guidance section for the Rockwell X-33 / Boeing XS-1 concept. Contains avionics, power distribution, and forward propellants.

    !RESOURCE[*],* {}
    !MODULE[ModuleReactionWheel*],* {}

    @MODULE[ModuleCommand]
    {
        @minimumCrew = 0
        RESOURCE
        {   
            name = ElectricCharge
            rate = 0.8
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 3200
        basemass = -1
        type = ServiceModule

        TANK
        {
            name = ElectricCharge
            amount = 40000
            maxAmount = 40000
        }
        TANK
        {
            name = MMH
            amount = 1450
            maxAmount = 1450
        }
        TANK
        {
            name = MON3
            amount = 1400
            maxAmount = 1400
        }
        TANK
        {
            name = Helium
            amount = 30000
            maxAmount = 30000
        }
    }
}

@PART[PROXI-XS1-MainTank]:FOR[RealismOverhaul]
{
    @mass = 11.5
    @title = Rockwell X-33 Midsection
    @description = Main propellant tank structure with optional payload bay cutouts and aerodynamic strakes for the Rockwell X-33 and Boeing XS-1.

    !RESOURCE[*],* {}
    !MODULE[ModuleFuelTanks],* {}

    MODULE
    {
        name = ModuleFuelTanks
        volume = 95000
        basemass = -1
        type = Cryogenic
    }

    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[XS1_BaySwitch]]
    {
        @SUBTYPE[No_Bay]
        {
            !MODULE,* {}
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleFuelTanks
                }
                DATA
                {
                    volume = 135000
                }
            }
        }
        
        @SUBTYPE[With_Bay]
        {
            !MODULE,* {}
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleFuelTanks
                }
                DATA
                {
                    volume = 95000
                }
            }
        }
    }
}

@PART[PROXI-XS1-Mount]:FOR[RealismOverhaul]
{
    @mass = 1.8
    @title = Rockwell X-33 Aft Structure
    @description = Structural aft thrust mount designed to distribute loads from engines, body flaps, and main aerodynamic lifting surfaces.
}

@PART[PROXI-XS1-RCS]:FOR[RealismOverhaul]
{
    @mass = 0.08
    @title = Rockwell X-33 Thruster Pack
    @description = Hypergolic reaction control thruster cluster providing 3-axis attitude control during exo-atmospheric flight and reentry.

    @MODULE[ModuleRCS*]
    {
        @name = ModuleRCSFX
        @thrusterPower = 1.75

        !resourceName = DELETE
        !PROPELLANT[*],* {}

        PROPELLANT
        {
            name = MMH
            ratio = 0.5078
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.4922
        }
        PROPELLANT
        {
            name = Helium
            ratio = 12.9
            ignoreForIsp = True
        }

        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 305
            key = 1 110
        }
    }
}

