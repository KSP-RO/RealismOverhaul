{
    @mass = 25
    @title = Starclipper External Tank
    @description = The External Tank for Lockheed's Starclipper proposal
    
    !RESOURCE[*],* {}

    MODULE
    {
        name = ModuleFuelTanks
        volume = 4200000
        basemass = -1
        type = Cryogenic
        
        TANK
        {
            name = LqdOxygen
            amount = 995043
            maxAmount = 995043
        }
        TANK
        {
            name = LqdHydrogen
            amount = 3204957
            maxAmount = 3204957
        }
    }
}

