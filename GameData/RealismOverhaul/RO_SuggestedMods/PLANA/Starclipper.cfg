@PART[PROXI-SC-ET]:FOR[RealismOverhaul]
{
    @mass = 12.971 
    @title = Starclipper External Tank
    @description = The External Tank for Lockheed's Starclipper proposal
    
    !RESOURCE[*],* {}

    MODULE
    {
        name = ModuleFuelTanks
        volume = 4200000
        basemass = -1
        type = Cryogenic
        
        TANK
        {
            name = LqdOxygen
            amount = 1140048
            maxAmount = 1140048
        }
        TANK
        {
            name = LqdHydrogen
            amount = 3059952
            maxAmount = 3059952
        }
    }
