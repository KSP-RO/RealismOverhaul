@PART[PROXI-SC-*]:FOR[RealismOverhaul]
{
    %maxTemp = 1255
    %skinMaxTemp = 2300
    %skinThermalMassModifier = 1.780
    %skinInternalConductionMult = 0.0013
    %skinSkinConductionMult = 0.0013
    %skinMassPerArea = 0.815
    %absorptiveConstant = 0.15
    %heatConductivity = 0.0001 // Otherwise, the engines blow up on re-entry
    %emissiveConstant = 0.85
    %thermalMassModifier = 1.0

    %RSSROConfig = True
    @rescaleFactor = 1

    @manufacturer = #roMfrLockhee


    &tags = 
    @tags ^= :$: PLANA Starclipper spaceplane:
}


@PART[PROXI-SC-body]:FOR[RealismOverhaul]
{
    @mass = 48.0
    @title = Starclipper
    @description = The main body of Lockheed's Starclipper proposal. Powered by three M-1 engines.
    
    !RESOURCE[*],* {}
    !MODULE[ModuleReactionWheel*],*{}

    @MODULE[ModuleCommand]
    {
        @minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 1.0
        }
    }

    %ROLSTankStorage = 98

    @MODULE[ModuleRCS*]
    {
        @name = ModuleRCSFX
        @thrusterPower = 1.5

        !resourceName = DELETE
        !PROPELLANT[*],* {}

        PROPELLANT
        {
            name = MMH
            ratio = 0.5078
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.4922
        }
        PROPELLANT
        {
            name = Helium
            ratio = 12.9
            ignoreForIsp = True
        }
        
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 300
            key = 1 100
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 100000
        basemass = -1
        type = ServiceModule
        
        TANK
        {
            name = ElectricCharge
            amount = 10000.0
            maxAmount = 10000.0
        }
        TANK
        {
            name = LqdOxygen
            amount = 613.6
            maxAmount = 613.6
        }
        TANK
        {
            name = LqdHydrogen
            amount = 1245.2
            maxAmount = 1245.2
        }
        TANK
        {
            name = MMH
            amount = 1093
            maxAmount = 1093
        }
        TANK
        {
            name = MON3
            amount = 1060
            maxAmount = 1060
        }
        TANK
        {
            name = Helium
            amount = 27774
            maxAmount = 27774
        }
    }
}

