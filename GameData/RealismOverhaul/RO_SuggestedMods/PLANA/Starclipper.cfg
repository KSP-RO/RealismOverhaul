@PART[PROXI-SC-*]:FOR[RealismOverhaul]
{
    %maxTemp = 923.15
    %skinMaxTemp = 3000
    %skinThermalMassModifier = 0.43613
    %skinInternalConductionMult = 0.0000105
    %skinMassPerArea = 0.815
    %absorptiveConstant = 0.15	
    %emissiveConstant = 0.85
    %thermalMassModifier = 1.0

    %RSSROConfig = True
    @rescaleFactor = 1

    @manufacturer = #roMfrLockhee


    &tags = 
    @tags ^= :$: PLANA Starclipper spaceplane:
}


@PART[PROXI-SC-body]:FOR[RealismOverhaul]
{
    @mass = 6.9 // 20 tons - 3 SSME - Aero = 6.9, haha nice
    @title = Starclipper
    @description = The main body of Lockheed's Starclipper proposal
    
    !RESOURCE[*],* {}
    !MODULE[ModuleReactionWheel*],*{}

    @MODULE[ModuleCommand]
    {
        @minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 1.0
        }
    }

    %ROLSTankStorage = 30

    @MODULE[ModuleRCS*]
    {
        @name = ModuleRCSFX
        @thrusterPower = 1.5

        !resourceName = DELETE
        !PROPELLANT[*],* {}

        PROPELLANT
        {
            name = MMH
            ratio = 0.5078
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.4922
        }
        PROPELLANT
        {
            name = Helium
            ratio = 12.9
            ignoreForIsp = True
        }
        
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 300
            key = 1 100
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 100000
        basemass = -1
        type = ServiceModule
        
        TANK
        {
            name = ElectricCharge
            amount = 10000.0
            maxAmount = 10000.0
        }
        TANK
        {
            name = LqdOxygen
            amount = 613.6
            maxAmount = 613.6
        }
        TANK
        {
            name = LqdHydrogen
            amount = 1245.2
            maxAmount = 1245.2
        }
    }
}

