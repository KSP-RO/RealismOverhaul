@PART[PROXI-SC-AirEngine]:FOR[RealismOverhaul]
{
    %engineType = JT8D
    // Give it some kerosene
    MODULE
    {
        name = ModuleFuelTanks
        volume = 3000
        basemass = -1
        type = Default
 
        TANK
        {
            name = Kerosene
            amount = 2500
            maxAmount = 2500
        }
    }
}

@PART[PROXI-SC-AirEngine]:AFTER[RealismOverhaulEngines]
{
    // Set here because the JT8D config overwrites title/description at FOR[RealismOverhaulEngines]
    @title = Starclipper JT8D Jet Engine
    @description = The jet engine for Lockheed's Starclipper proposal

    %MODULE[ModuleResourceIntake]
    {
        @name = AJEInlet
        %Area = 1.0
        !TPRCurve {}
        #@AJE_TPR_CURVE_DEFAULTS/PitotTube/TPRCurve {}

        %inletTitle = #$@AJE_TPR_CURVE_DEFAULTS/PitotTube/title$
        %inletDescription = #$@AJE_TPR_CURVE_DEFAULTS/PitotTube/description$
    }

    @MODULE[ModuleEngineConfigs]
    {
        @CONFIG,*
        {
            %intakeMatchArea = True
        }
    }
}

