@PART[SXTsolarPanelhex]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@mass = 0.0051 // Level 6 solid @ 0.006t/m^2
	@manufacturer = #roMfrGeneric
	@description = Static 1975 era panel. 0.85m^2
	//Solar
	%skinTempTag = Solar
	%internalTempTag = Instruments
	!MODULE[TweakScale]
	{
	}
	@MODULE[ModuleDeployableSolarPanel]
	{
		@chargeRate = 0.153	// Level 6 @ 0.180kW/m^2
	}
	
	!SolarConfig,* { }
	
	%useSolarConfig = true
	%solarUseMass = true
	SolarConfig
	{
		area = 0.85
		level = 6
		type = static
	}
}
@PART[SXTsolarPanelLarge]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@mass = 0.0305 // Level 6 extendable @ 0.006t/m^2 * 1.3
	@manufacturer = #roMfrGeneric
	@description = Extendable 1975 era solar panel. 8.0m^2
	//Solar
	%skinTempTag = Solar
	%internalTempTag = Instruments
	!MODULE[TweakScale]
	{
	}
	@MODULE[ModuleDeployableSolarPanel]
	{
		@chargeRate = 1.688	// Level 6 @ 0.180kW/m^2
	}
	
	!SolarConfig,* { }
	
	%useSolarConfig = true
	%solarUseMass = true
	SolarConfig
	{
		area = 8
		level = 6
		type = folded
	}
}
