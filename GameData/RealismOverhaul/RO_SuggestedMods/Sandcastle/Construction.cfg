    %rescaleFactor = 1.0
    @category = Utility
    %mass = 5.4
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 20
    %breakingForce = 2500
    %breakingTorque = 2500

    @MODULE[WBIModulePartGridVariants]
    {
        @elementLength = 7.5
        @elementWidth = 7.5
        @elementHeight = 0.3
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 9000
        maxAmount = 9000
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 2000 
    }
    RESOURCE
    {
        name = Ceramics
        amount = 0
        maxAmount = 600
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 200
    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 150 
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 50 
    }
    RESOURCE
    {
        name = Lead
        amount = 0
        maxAmount = 100 
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 30 
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 40 
    }

    MODULE
    {
        name = ModuleCommand
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 
        }
    }

    MODULE:NEEDS[RealAntennas]
    {
        name = ModuleRealAntenna
        antennaDiameter = 1.0 
        RFBand = S
    }

    MODULE
    {
        name = WBIPrinterRequirements
    }

    MODULE
    {
        name = WBIModuleBoundingBox
    }

    MODULE
    {
        name = WBIPrintShop
        maxPrintVolume = -1
        printSpeedUSec = 0.00001
        UseSpecialistBonus = true
        maxRemoteResourceRange = 100

        enablePartSpawn = true
        spawnTransformName = node_stack_top

        printShopGUIName =  Contsturction Pad
        printShopwGroupDisplayName = Contsturction Pad
        printShopDialogTitle = Contsturction Pad

        RESOURCE
        {
            name = ElectricCharge
            rate = 150.0 
        }
    }

    MODULE
    {
        name = WBIShipwright
        printSpeedUSec = 0.00001
        UseSpecialistBonus = True
        spawnTransformName = node_stack_top
        maxCraftDimensions = 45,45,90
        maxRemoteResourceRange = 100

        RESOURCE
        {
            name = ElectricCharge
            rate = 150.0 
        }
    }

    MODULE
    {
        name = WBIShipbreaker
        recycleSpeedUSec = 0.75
        recyclePercentage = 0.85
        UseSpecialistBonus = True
        maxBuildingDistance = 50

        RESOURCE
        {
            name = ElectricCharge
            rate = 65.0 
        }
    }
}


// =================================================================================
//  Orbital Assembly System Manipulator Arm (OAS-Arm)
//  High-Precision Orbital Assembly & Station Reclamation Arm
//
//  Dry Mass: 1,200 kg
//  EC Storage: 800 EC   
//  Logistics: WBIResourceDistributor (500m wireless resource pull/push)
//
//  Primary Tech Analogue:
//    - Canadarm3 (CSA / MDA) - Gateway Station Robotic Servicing System
//    - Shuttle RMS / Canadarm2 (Space Station Remote Manipulator System - SSRMS)
//    - ERA (European Robotic Arm)
//
//  Literature & Sources:
//    - CSA / MDA Canadarm3 Technical Briefing:https://www.asc-csa.gc.ca/eng/canadarm3/data-sheet.asp
//    - https://www.google.com/url?sa=t&rct=j&q=&esrc=s&source=web&cd=&cad=rja&uact=8&ved=2ahUKEwiWytbasaCWAxW9z_ACHZzIHM4QFnoECBoQAQ&url=https%3A%2F%2Fstandards.nasa.gov%2Fsites%2Fdefault%2Ffiles%2Fstandards%2FNASA%2FC%2F2022-04-08-NASA-STD-3001-Vol-2-Rev-C-Final.pdf&usg=AOvVaw0ZHfpQxf-IoaHViVVZEFVp&opi=89978449
//
//  Capabilities:
//    - Zero-G Orbital Assembly & Deployable Tooling
//    - Part & Vessel Printing Draw: 200 kW (200 EC/s continuous)
//    - Runtime on internal battery: ~4 seconds continuous printing (lowest of the three)
//    - Plasma Reclamation Draw: 90 kW (90 EC/s continuous)   
//    - Max Recycling Reach: 500 m
//
//  Internal Operational Buffer:
//    - Regolith: 200 units (~320 kg raw feedstock)
