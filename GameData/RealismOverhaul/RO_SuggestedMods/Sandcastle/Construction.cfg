// Original mod author: Angel-125
//
// Sandcastle construction parts, RO configs.
//
//
// Power draws, speeds and yields are gameplay values sized against the
// real-world analogues listed for each part; they are not taken from any one
// real machine.

// =================================================================================
//  Portable Field Additive Manufacturing Unit (Porta Printer)
//  EVA-carried part printer and recycler
//
//    - Printing:        0.5 kW  (~13 min on battery)
//    - Recycling:       0.2 kW  (~33 min on battery), 40% yield
//
//  Real-world basis:
//    - 3D Printing in Zero-G (Made In Space, ISS 2014): first printer in orbit,
//      small polymer parts from extruded filament
//    - Refabricator (Tethers Unlimited, ISS 2018): first combined printer and
//      plastic recycler in orbit
//    - ESA / Airbus metal 3D printer (ISS 2024): first metal part printed in orbit
//
//  Sources:
//    - NASA NTRS, 3D Printing in Zero-G Technology Demonstration:
//        https://ntrs.nasa.gov/citations/20140011672
//    - GeekWire, Tethers Unlimited delivers Refabricator to NASA (2018):
//        https://www.geekwire.com/2018/tethers-unlimited-delivers-3-d-printer-recycler-combo-nasa-space-station/
//    - ESA, ESA 3D prints first metal part on the ISS (2024):
//        https://www.esa.int/Newsroom/Press_Releases/ESA_3D_prints_first_metal_part_on_the_International_Space_Station
//    - NASA NTRS, In-Space Manufacturing overview, NSMMS 2022:
//        https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
// =================================================================================

@PART[wbiPortaPrinter]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Portable Field Additive Manufacturing Unit (Porta Printer)
    @manufacturer = NASA / JPL
    @description = A compact, EVA-deployable additive manufacturing unit that prints small structural, electrical and avionics components from metal, ceramic, polymer and regolith feedstock, and recycles small parts back into raw materials. It carries no feedstock of its own and draws it from nearby storage. Its integral battery pack allows short print or reclamation jobs away from external power.
    %mass = 0.025
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 12
    %breakingForce = 50
    %breakingTorque = 50

    !PARTS_WHITELIST {}
    !CATEGORY_WHITELIST{}

    !RESOURCE:HAS[~name[ElectricCharge]],* {}

    RESOURCE
    {
        name = ElectricCharge
        amount = 400
        maxAmount = 400
    }

    @MODULE[WBIDeployedPrintShop]
    {
        @maxPrintVolume = 35
        @printSpeedUSec = 0.000002
        @UseSpecialistBonus = true

        @RESOURCE[ElectricCharge]
        {
            @rate = 0.5
        }

        CATEGORY_WHITELIST
        {
            whitelistedCategory = Structural
            whitelistedCategory = Electrical
            whitelistedCategory = Control
            whitelistedCategory = Communication
        }
    }

    @MODULE[WBICargoRecycler]
    {
        @recyclePercentage = 0.40
        @recycleSpeedUSec = 0.5
        @UseSpecialistBonus = true

        @RESOURCE[ElectricCharge]
        {
            @rate = 0.2
        }
    }
}

// =================================================================================
//  Automated Additive Manufacturing Facility (2.5m AMF)
//  Uncrewed surface part printer, small-vessel builder and recycler
//
//
//  Real-world basis:
//    - NASA MMPACT (Moon to Mars Planetary Autonomous Construction
//      Technologies): autonomous building of lunar pads, berms and shelters
//      from regolith
//    - ICON Project Olympus: laser melting of lunar regolith into ceramic-like
//      structures, under a NASA contract running to 2028
//
//  Sources:
//    - NASA NTRS, Edmunson, MMPACT overview:
//        https://ntrs.nasa.gov/citations/20205007535
//    - NASA NTRS, ISRU Technology Review 2022 (laser-melted regolith, LunarPAD):
//        https://ntrs.nasa.gov/api/citations/20220012533/downloads/ISRU%20Tech%20Review%202022%20Edmunson%20v2.pdf
//    - 3D Printing Industry, ICON awarded $57.2M NASA contract for Olympus:
//        https://3dprintingindustry.com/news/icon-awarded-new-57-2m-nasa-contract-to-develop-system-than-can-3d-print-lunar-structures-218125/
//    - NASA NTRS, In-Space Manufacturing overview, NSMMS 2022:
//        https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
// =================================================================================

@PART[wbiELSandcaster]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Automated Additive Manufacturing Facility 
    @manufacturer = NASA / JPL
    @description = An automated 2.5-meter additive manufacturing unit for off-world infrastructure. Using high-power laser sintering, it turns regolith, metal alloys, polymers and silicon into finished parts and small vessels without crew supervision, and recycles old hardware back into materials. It carries no feedstock of its own and draws it from storage within 50 m. Its oversized battery bank lets it run for long periods without external power.
    %mass = 2.5
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 10
    %breakingForce = 250
    %breakingTorque = 250
    !MODULE[ELConverter],* {}
    !MODULE[ELWorkshop],* {}
    !MODULE[ELSurveyStation],* {}

    !RESOURCE:HAS[~name[ElectricCharge]],* {}

    RESOURCE
    {
        name = ElectricCharge
        amount = 75000
        maxAmount = 75000
    }

    MODULE
    {
        name = ModuleCommand
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05
        }
    }

    MODULE:NEEDS[RealAntennas]
    {
        name = ModuleRealAntenna
        antennaDiameter = 1.0
        RFBand = S
    }

    @MODULE[WBIModuleAnimateGenericExtended]
    {
        @animationName = Deploy
    }

    @MODULE[WBIPrintShop]
    {
        @maxPrintVolume = -1
        @printSpeedUSec = 0.000002
        @UseSpecialistBonus = false
        maxRemoteResourceRange = 50
        %enablePartSpawn = true

        @RESOURCE[ElectricCharge]
        {
            @rate = 22.0
        }

        CATEGORY_WHITELIST
        {
            whitelistedCategory = Utility
            whitelistedCategory = Structural
            whitelistedCategory = Payload
            whitelistedCategory = Thermal
            whitelistedCategory = Fuel Tanks
            whitelistedCategory = Robotics
            whitelistedCategory = Ground
            whitelistedCategory = Electrical
            whitelistedCategory = Control
            whitelistedCategory = Communication
            whitelistedCategory = Aero
        }
    }

    @MODULE[WBIShipwright]
    {
        @spawnTransformName = LaunchPos
        %maxCraftDimensions = 15,15,30
        @printSpeedUSec = 0.000002
        maxRemoteResourceRange = 50

        @RESOURCE[ElectricCharge]
        {
            @rate = 22.0
        }
    }

    @MODULE[WBIShipbreaker]
    {
        @recyclePercentage = 0.45
        @recycleSpeedUSec = 0.5
        @maxBuildingDistance = 50

        @RESOURCE[ElectricCharge]
        {
            @rate = 9.0
        }
    }
}


// =================================================================================
//  Vessel Assembly Platform
//  Surface vessel assembly pad (no part printing)
//
//    - Vessel building: 150 kW (~60 s on battery, needs external power)
//    - Recycling:       65 kW  (~2.3 min on battery), 85% yield
//    - Material pull:   100 m
//
//  Real-world basis:
//    - NASA MMPACT / LunarPAD: regolith landing and launch pads as the first
//      piece of surface infrastructure
//    - ICON Project Olympus: a launch and landing pad named as the likely
//      first lunar structure
//
//  Sources:
//    - NASA NTRS, MMPACT (ASCEND 2021):
//        https://ntrs.nasa.gov/api/citations/20210022078/downloads/MMPACT_ASCEND.pdf
//    - NASA NTRS, ISRU Technology Review 2022 (LunarPAD):
//        https://ntrs.nasa.gov/api/citations/20220012533/downloads/ISRU%20Tech%20Review%202022%20Edmunson%20v2.pdf
//    - 3D Printing Industry, ICON awarded $57.2M NASA contract for Olympus:
//        https://3dprintingindustry.com/news/icon-awarded-new-57-2m-nasa-contract-to-develop-system-than-can-3d-print-lunar-structures-218125/
// =================================================================================

@PART[yardFrameFlat75]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Vessel Assembly Platform
    @manufacturer = Boeing / Lockheed Martin
    @description = A flat 7.5-meter modular platform laid down on a planetary surface to assemble and launch vessels on site. Lay out as many tiles as the job needs, stock nearby tanks with materials, and the platform builds the vessel on top of itself.
    %rescaleFactor = 1.0
    @category = Utility
    %mass = 5.4
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 20
    %breakingForce = 2500
    %breakingTorque = 2500

    @MODULE[WBIModulePartGridVariants]
    {
        @elementLength = 7.5
        @elementWidth = 7.5
        @elementHeight = 0.3
    }

    !RESOURCE:HAS[~name[ElectricCharge]],* {}

    RESOURCE
    {
        name = ElectricCharge
        amount = 9000
        maxAmount = 9000
    }

    MODULE
    {
        name = ModuleCommand
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05
        }
    }

    MODULE:NEEDS[RealAntennas]
    {
        name = ModuleRealAntenna
        antennaDiameter = 1.0
        RFBand = S
    }

    MODULE
    {
        name = WBIPrinterRequirements
    }

    MODULE
    {
        name = WBIModuleBoundingBox
    }

    // Vessel constructor only: no individual part printing
    !MODULE[WBIPrintShop],* {}

    MODULE
    {
        name = WBIShipwright
        printSpeedUSec = 0.00001
        UseSpecialistBonus = True
        spawnTransformName = node_stack_top
        maxCraftDimensions = 45,45,90
        maxRemoteResourceRange = 100

        RESOURCE
        {
            name = ElectricCharge
            rate = 150.0
        }
    }

    MODULE
    {
        name = WBIShipbreaker
        recycleSpeedUSec = 0.75
        recyclePercentage = 0.85
        UseSpecialistBonus = True
        maxBuildingDistance = 50

        RESOURCE
        {
            name = ElectricCharge
            rate = 65.0
        }
    }
}
