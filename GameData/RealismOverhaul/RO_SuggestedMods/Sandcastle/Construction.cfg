    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 35 
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 15 
    }
    RESOURCE
    {
        name = Lead
        amount = 0
        maxAmount = 15 
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 10 
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 5 
    }

    MODULE
    {
        name = WBIPrinterArm
        animationName = Deploy 
