// =================================================================================
//  Porta Printer (Deployable Field Additive Manufacturing Unit)
//  Portable EVA-Deployable 3D Printer / Recycler
//
//  Dry Mass: 25 kg
//  Print Volume: 35 L
//  EC Storage: 400 EC   [NEW - small integral battery pack, part has none stock]
//
//  Primary Tech Analogue:
//    - Portable/field metal & polymer 3D printing units (handheld laser
//      sintering tools, small EVA-deployable additive manufacturing rigs)
//
//Literature & Sources:
//    - https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
//    - https://www.nasa.gov/wp-content/uploads/2015/03/nwerkheiser_lsii_oct2019_508.pdf
//    - https://ntrs.nasa.gov/api/citations/20220005590/downloads/UK_ADDITIVE%20WORLD_4.20.2022%20%20FINAL.pdf
//
//  Printer Properties (WBIDeployedPrintShop):
//    - Power Draw: 0.5 kW (0.5 EC/s continuous during active print jobs)
//      [Ref: low-power single-point laser/extrusion head sized for small,
//       EVA-portable parts rather than industrial throughput]
//    - Runtime on internal battery: ~13 minutes continuous printing
//    - Primary Input Materials: Regolith Feedstock, Ceramics, Metal, Aluminium, Polymers, Silicon, RareMetals
//
//  Internal Operational Buffer:
//    - Regolith: 20 units (~32 kg raw feedstock)
//    - Ceramics: 8 units (~23 kg sintered structural feedstock)
//    - Metal: 2 units (~16 kg structural alloy)
//    - Aluminium: 4 units (~11 kg structural alloy)
//    - Polymers: 8 units (~8 kg resin/composite feedstock)
//    - Silicon: 4 units (~9 kg substrate stock)
//    - RareMetals: 1 unit (~8 kg microelectronics/specialty alloys)
//
// =================================================================================

@PART[wbiPortaPrinter]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Portable Field Additive Manufacturing Unit (Porta Printer)
    @manufacturer = NASA / JPL
    @description = A compact, EVA-deployable additive manufacturing unit capable of sintering small structural and utility components from regolith, metal, ceramic, and polymer feedstocks. Designed for expedient field repairs and small-part fabrication where a full-scale manufacturing facility isn't practical. Its integral battery pack allows short, unattended print or reclamation jobs away from external power.
    %mass = 0.025
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 12
    %breakingForce = 50
    %breakingTorque = 50

    !PARTS_WHITELIST {}
    !CATEGORY_WHITELIST{}

    RESOURCE
    {
        name = ElectricCharge
        amount = 400
        maxAmount = 400
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 20
    }
    RESOURCE
    {
        name = Ceramics
        amount = 0
        maxAmount = 8
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 2
    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 4
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 8
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 4
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 1
    }

    @MODULE[WBIDeployedPrintShop]
    {
        @maxPrintVolume = 35
        @printSpeedUSec = 0.000002
        @UseSpecialistBonus = true

        @RESOURCE[ElectricCharge]
        {
            @rate = 0.5
        }

        CATEGORY_WHITELIST
        {
            whitelistedCategory = Pods
            whitelistedCategory = Structural
            whitelistedCategory = Electrical
            whitelistedCategory = Control
            whitelistedCategory = Communication
        }
    }

    @MODULE[WBICargoRecycler]
    {
        @recyclePercentage = 0.40
        @recycleSpeedUSec = 0.5
        @UseSpecialistBonus = true

        @RESOURCE[ElectricCharge]
        {
            @rate = 0.2
        }
    }
}

// =================================================================================
//  Automated Additive Manufacturing Facility (2.5m AMF)
//  High-Precision Additive Manufacturing Unit
//
//  Dry Mass: 2,500 kg
//  Diameter: 2.5 m
//  EC Storage: 75,000 EC   
//
//  Primary Tech Analogue:
//    - NASA In-Space Manufacturing (ISM) Project & MSEE (Moon to Mars Planetary Autonomous Construction)
//
//  Literature & Sources:
//    - https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
//    - https://www.nasa.gov/wp-content/uploads/2015/03/nwerkheiser_lsii_oct2019_508.pdf
//    - https://ntrs.nasa.gov/api/citations/20220005590/downloads/UK_ADDITIVE%20WORLD_4.20.2022%20%20FINAL.pdf
//
//  Printer Properties (WBIPrintShop / WBIShipwright):
//    - Power Draw: 22 kW (22 EC/s continuous during active print jobs)   
//      [Ref: efficiency-optimized single-head fiber laser array, sized for
//       long-duration unattended operation rather than peak throughput]
//    - Runtime on internal battery: ~57 minutes continuous printing
//    - Primary Input Materials: Regolith Feedstock, Ceramics, Metal, Aluminium, Polymers, Silicon, RareMetals
//
//  Recycler Properties (WBIShipbreaker):
//    - Power Draw: 9 kW (9 EC/s during reclamation)   
//      [Ref: lower-throughput induction furnace tuned for low standby/idle losses]
//    - Recovery Yield: 85% mass recovery to storage buffers
//    - Runtime on internal battery: ~2.3 hours continuous reclamation
//
//  Internal Operational Buffer:
//    - Regolith: 500 units (~800 kg raw feedstock  ~1.6 t/m^3 bulk density)
//    - Ceramics: 150 units (~435 kg sintered structural feedstock)   [NEW]
//    - Metal: 25 units (~195 kg structural alloy)
//    - Aluminium: 30 units (~83 kg structural alloy  2.7 g/cm^3)
//    - Polymers: 50 units (~50 kg resin/composite feedstock)
//    - Silicon: 40 units (~93 kg substrate stock)
//    - RareMetals: 10 units (~78 kg microelectronics/specialty alloys)
// =================================================================================

@PART[wbiELSandcaster]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Automated Additive Manufacturing Facility (2.5m AMF)
    @manufacturer = NASA / JPL
    @description = An automated, closed-loop 2.5-meter additive manufacturing unit designed for off-world infrastructure construction. Utilizing high-power laser powder-bed fusion, it sinters raw regolith feedstocks, refined metallic alloys, polymers, and silicon substrates directly into precision components and vessel assemblies without requiring direct human intervention. Its oversized internal battery bank lets it operate for extended periods without external power support.
    %mass = 2.5
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 10
    %breakingForce = 250
    %breakingTorque = 250
    !MODULE[ELConverter],* {}
    !MODULE[ELWorkshop],* {}
    !MODULE[ELSurveyStation],* {}

    !RESOURCE[RocketParts] {}
    !RESOURCE[Metal] {}

    RESOURCE
    {
        name = ElectricCharge
        amount = 75000
        maxAmount = 75000
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 500 
    }
    RESOURCE
    {
        name = Ceramics
        amount = 0
        maxAmount = 150
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 25 
    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 30 
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 50 
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 40 
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 10 
    }
    
    MODULE
    {
        name = ModuleCommand
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 
        }
    }

    MODULE:NEEDS[RealAntennas]
    {
        name = ModuleRealAntenna
        antennaDiameter = 1.0 
        RFBand = S
    }
    
    @MODULE[WBIModuleAnimateGenericExtended]
    {
        @animationName = Deploy 
    }

    @MODULE[WBIPrintShop]
    {
        @maxPrintVolume = -1 
        @printSpeedUSec = 0.000002
        @UseSpecialistBonus = false
        maxRemoteResourceRange = 50
        %enablePartSpawn = true

        @RESOURCE[ElectricCharge]
        {
            @rate = 22.0 
        }

        CATEGORY_WHITELIST
        {  
            whitelistedCategory = Utility
            whitelistedCategory = Structural
            whitelistedCategory = Payload
            whitelistedCategory = Thermal
            whitelistedCategory = Fuel Tanks
            whitelistedCategory = Robotics
            whitelistedCategory = Ground
            whitelistedCategory = Electrical
            whitelistedCategory = Control
            whitelistedCategory = Communication
            whitelistedCategory = Aero
        }
    }

    @MODULE[WBIShipwright]
    {
        @spawnTransformName = LaunchPos
        %maxCraftDimensions = 15,15,30 
        @printSpeedUSec = 0.000002
        maxRemoteResourceRange = 50

        @RESOURCE[ElectricCharge]
        {
            @rate = 22.0 
        }
    }
    @MODULE[WBIShipbreaker]
    {
        @recyclePercentage = 0.45
        @recycleSpeedUSec = 0.5   
        @maxBuildingDistance = 50
        
        @RESOURCE[ElectricCharge]
        {
            @rate = 9.0 
        }
    }
}


// =================================================================================
//  Off-World Modular Assembly Platform (MAP-75)
//
//  Dry Mass: 5,400 kg
//  Grid Footprint: 7.5 m x 7.5 m base (expandable via grid variants)
//  EC Storage: 9,000 EC   

//  Logistics: WBIResourceDistributor (500m wireless resource pull radius)
//  Comms: Integrated S-Band Phased Array (Lunar Distance Link / ~1.0m Equivalent)
//
//
//  Literature & Sources:
//    - https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
//    - https://www.nasa.gov/wp-content/uploads/2015/03/nwerkheiser_lsii_oct2019_508.pdf
