// =================================================================================
//  Construction Yard Floodlight Array (wbiYardLight)
//  High-Intensity Worksite & Shipyard Illuminator
//
//  Dry Mass: 80 kg (0.08 t)
//  EC Draw: 1.5 kW (1.5 EC/s) when fully illuminated
// =================================================================================

@PART[wbiYardLight]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True
    @title = Construction Yard Floodlight Array
    @manufacturer = General Electric / NASA
    @description = A heavy-duty, high-lux floodlight fixture engineered specifically for deep-space assembly yards, station trusses, and planetary construction sites. Features an integrated multi-element LED optics bank designed to illuminate large craft structures and work envelopes during dark orbital passes.
    @category = Utility
    %mass = 0.08
    %maxTemp = 1500
    %skinMaxTemp = 1500
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 10
    %breakingForce = 150
    %breakingTorque = 150
    @MODULE[ModuleLight]
    {
        @resourceAmount = 1.5 
    }
}