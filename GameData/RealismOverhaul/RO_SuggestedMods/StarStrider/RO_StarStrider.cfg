@PART[BKI25_Pod_DrogueChute]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.6

	@title = Star Strider Drogue Parachutes
	@manufacturer = #roMfrGeneric
	@description = Drogue parachutes for the Star Strider Command Module.

	@mass = 0.03
	%skinTempTag = Fiberglass
	%internalTempTag = Instruments

	!MODULE[ModuleAutoCutDrogue] {}
	!MODULE[ModuleParachute],* {}
	MODULE
	{
		name = RealChuteModule
		caseMass = 0.03
		timer = 0
		mustGoDown = True
		spareChutes = 0
		cutSpeed = 0.5
		PARACHUTE
		{
			parachuteName = canopy
			capName = cap
			preDeploymentAnimation = semi_deploy
			deploymentAnimation = full_deploy
			material = Nylon
			minIsPressure = False
			minPressure = 0.01
			preDeployedDiameter = 5.2
			preDeploymentSpeed = 1.6
			minDeployment = 7625
			deployedDiameter = 10.0
			deploymentSpeed = 10.0
			deploymentAlt = 7315
			cutAlt = 3350
		}
	}
}
@PART[BKI25_Pod_DrogueChute]:AFTER[zzzRealismOverhaul]
{
	@MODULE[RealChuteModule]
	{
		@PARACHUTE
		{
			@minDeployment = 7625
			@deploymentAlt = 7315
			@cutAlt = 3350
		}
	}
}

