@PART[BKI25_Pod]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 1.6
	@CoMOffset = 0.0, 1.14, 0.0
	@CoPOffset = 0.0, 0.96, 0.0
	@CoLOffset = 0.0, -0.72, 0.0
	@CenterOfBuoyancy = 0.0, 1.28, 0.0

	@title = Star Strider Command Module
	@manufacturer = #roMfrGeneric
	@description = The pressurized cabin of the Star Strider Command Module. Carries supplies for four crew for three days.

	@mass = 2.9
	%skinMaxTemp = 2000
	%skinTempTag = HRSI
	%internalTempTag = Instruments
	%skinInsulationTag = True

	!RESOURCE,* {}
	!MODULE[ModuleReactionWheel],* {}

	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 1.5
		}
	}

	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[commandSwitch]]
	{
		@SUBTYPE[Unmanned]
		{
			@addedMass = 0.15
		}
	}

	MODULE
	{
		name = AdjustableCoMShifter
		DescentModeCoM = 0.0, 1.14, 0.15
	}

	%ROLSCrew = 4
	%ROLSTankStorage = 12	// 4 crew for 3 days

	MODULE
	{
		name = ModuleFuelTanks
		type = SM-IV
		volume = 4000
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = 1500
			maxAmount = 1500
		}
	}

	@MODULE[ModuleRCSFX]
	{
		!resourceName = NULL
		!atmosphereCurve {}
		@thrusterPower = 0.411
		PROPELLANT
		{
			name = MMH
			ratio = 0.4967
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.5033
		}
		PROPELLANT
		{
			name = Helium
			ratio = 11.25
			ignoreForIsp = True
		}
		atmosphereCurve
		{
			key = 0 274
			key = 1 137
		}
	}

	!MODULE[ModuleDataTransmitter],* {}
	MODULE
	{
		name = ModuleRealAntenna
		referenceGain = 1.5
		RFBand = S
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
		impassablenodes = bottom
	}
}

