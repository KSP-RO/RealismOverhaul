//	==================================================
//	Supplementary Electric Engines (Triplchii)
//	https://spacedock.info/mod/3417/Supplementary%20Electric%20Engines
//
//	KO-R1 "Fudge"   resistojet	-> TRW Intelsat V EHT
//	KO-R2 "Toffee"  resistojet	-> MR-501 / MR-502 IMPEHT
//	KO-A1 "Teacake" arcjet		-> MR-510
//	KO-A2 "Gumdrop" arcjet		-> ESEX 26 kW ammonia arcjet
//	KO-22 "Pancake" PPT			-> EO-1 PPT
//	KO-33 "Waffle"  PPT			-> LES-8/9 PPT
//	KO-F1 "Sorbet"  FEEP		-> Caesium FEEP (Alta / ESA)
//	KO-RR resistojet RCS		-> generic electric RCS
//	CS-* caesium tanks			-> kept as fixed Caesium tanks (propellant for the FEEP)
//	==================================================

// Solid Teflon propellant for the pulsed plasma thrusters. Lives only in the thruster itself.
RESOURCE_DEFINITION:NEEDS[SupplementaryElectricEngines]
{
	name = PTFE
	displayName = PTFE (Teflon)
	abbreviation = PTFE
	density = 0.0022	// 2.2 kg/L
	unitCost = 0.05
	flowMode = NO_FLOW
	transfer = NONE
	isTweakable = false
	isVisible = true
}

@PART[KO-A1_Teacake|KO-A2_Gumdrop|PPT_22|PPT_33|SEE_FEEP_engine|rj_engine_big|rj_engine_small|SEE_rj_rcs]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	!MODULE[TweakScale] {}
	!MODULE[ModuleAlternator] {}
	!RESOURCE,* {}
	@maxTemp = 1973.15
	%skinMaxTemp = 2073.15
}

@PART[rj_engine_small]:FOR[RealismOverhaul]	// KO-R1 "Fudge"
{
	%engineType = TRWEHT
}

@PART[rj_engine_big]:FOR[RealismOverhaul]	// KO-R2 "Toffee"
{
	%engineType = MR501
	@MODULE[ModuleJettison] { @jettisonedObjectMass = 0.001 }
}

@PART[KO-A1_Teacake]:FOR[RealismOverhaul]	// KO-A1 "Teacake"
{
	%engineType = MR510
	@MODULE[ModuleJettison] { @jettisonedObjectMass = 0.002 }
}

@PART[KO-A2_Gumdrop]:FOR[RealismOverhaul]	// KO-A2 "Gumdrop"
{
	%engineType = ESEX
	@MODULE[ModuleJettison] { @jettisonedObjectMass = 0.005 }
}

@PART[PPT_22]:FOR[RealismOverhaul]	// KO-22 "Pancake"
{
	%engineType = EO1PPT
}

@PART[PPT_33]:FOR[RealismOverhaul]	// KO-33 "Waffle"
{
	%engineType = LES89PPT
}

@PART[SEE_FEEP_engine]:FOR[RealismOverhaul]	// KO-F1 "Sorbet"
{
	%engineType = CsFEEP
}

@PART[SEE_rj_rcs]:FOR[RealismOverhaul]	// KO-RR resistojet RCS
{
	%engineType = ElectricRCSGeneric
	// B9 variants subtract stock-scale tonnes; the RCS config sets a ~5 kg block, keep variants massless
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
	{
		@SUBTYPE,*
		{
			!addedMass = DEL
			!addedCost = DEL
		}
	}
}

// Caesium tanks: keep the mod's Caesium (1.93 kg/L), just make them RO parts
@PART[see_indiumTank_0625|see_indiumTank_125|see_indiumTank_radial]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	!MODULE[TweakScale] {}
	@maxTemp = 1273.15
	%skinMaxTemp = 1373.15
}
