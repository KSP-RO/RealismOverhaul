{
	%RSSROConfig = True
	@rescaleFactor = 2.0513
	@mass = 0.310

	@title = Fregat Upper Stage [Tank]
	@description = Houses electronics and propellants.

	!RESOURCE[LiquidFuel]
	{
	}
	!RESOURCE[Oxidizer]
	{
	}
	!RESOURCE[MonoPropellant]
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		volume = 4808.768404
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = 181440
			maxAmount = 181440 //0.525 tonnes
		}
		TANK
		{
			name = UDMH
			amount = 2184.5
			maxAmount = 2184.5
		}
		TANK
		{
			name = NTO
			amount = 2442.7
			maxAmount = 2442.7
		}
	}
}

// RT
@PART[TUS_LFO_1|TUS_Engine_1]:FOR[RealismOverhaul]:NEEDS[RemoteTech]
{
	MODULE
	{
		name = ModuleSPU
		IsRTCommandStation = False
	}
	MODULE
	{
		name = ModuleRTAntennaPassive
		OmniRange = 1500000
		TRANSMITTER
		{
			PacketInterval = 0.4
			PacketSize = 2
			PacketResourceCost = 1.0
		}
	}
}

// Full stage
@PART[TUS_Engine_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@rescaleFactor = 2.0513
	@mass = 0.385

	@title = Fregat Upper Stage
	@description = Used on Soyuz and Proton launchers.

	!RESOURCE[LiquidFuel]
	{
	}
	!RESOURCE[Oxidizer]
	{
	}
	!RESOURCE[MonoPropellant]
	{
	}
	MODULE
	{
		name = ModuleFuelTanks
		volume = 4808.768404
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = 181440
			maxAmount = 181440 //0.525 tonnes
		}
		TANK
		{
			name = UDMH
			amount = 2184.5
			maxAmount = 2184.5
		}
		TANK
		{
			name = NTO
			amount = 2442.7
			maxAmount = 2442.7
		}
	}

	@MODULE[ModuleEngines*]
	{
		@minThrust = 19.61
		@maxThrust = 19.61
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = UDMH
			@ratio = 0.4721
			%DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = NTO
			@ratio = 0.5279
		}
		@atmosphereCurve
		{
			@key,0 = 0 327
			@key,1 = 1 128
		}
		%ullage = True
		%pressureFed = True
		%ignitions = 20
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = UDMH
			amount = 0.4721
		}
		IGNITOR_RESOURCE
		{
			name = NTO
			amount = 0.5279
		}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = S5.92
		origMass = 0.385
		modded = false
		CONFIG
		{
			name = S5.92
			minThrust = 19.61
			maxThrust = 19.61
			heatProduction = 100
			massMult = 1.0
			PROPELLANT
			{
				name = UDMH
				ratio = 0.4721
				DrawGauge = True
			}
			PROPELLANT
			{
				name = NTO
				ratio = 0.5279
			}
			atmosphereCurve
			{
				key = 0 327
				key = 1 128
			}
		}
	}
}

@PART[TUS_Engine_1|TUS_LFO_1]:FOR[RealismOverhaul]
{
	%category = none
}
