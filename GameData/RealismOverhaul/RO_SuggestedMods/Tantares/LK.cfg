@PART[lk_v2_fuel_cell_srf_1]:NEEDS[!Kerbalism]:FOR[RealismOverhaul]
{
	MODULE
	{
		name = ModuleGenerator
		isAlwaysActive = true
		efficiency = 1
		INPUT_RESOURCE
		{
			name = LqdHydrogen
			rate = 0.000777906
		}
		INPUT_RESOURCE
		{
			name = LqdOxygen
			rate = 0.0003864304
		}
		OUTPUT_RESOURCE
		{
			name = Water
			rate = 0.000496032
		}
		OUTPUT_RESOURCE
		{
			name = ElectricCharge
			rate = 1.5
		}
	}
}

