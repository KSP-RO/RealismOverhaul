@PART[castor_control_s0_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True

	@rescaleFactor = 1.6
	@mass = 0.04
	%maxTemp = 1073.15

	@title = Castor CR-A Avionics [1 m]
	@manufacturer = #roMfrOKB1
	@description = Compact transistorised flight computer and guidance unit for small uncrewed spacecraft and upper stages.

	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0.04
		}
	}

	%reactionWheelPowerDraw = 0.05
	%reactionWheelMode = wheel

	!RESOURCE,* {}

	MODULE
	{
		name = ModuleFuelTanks
		volume = 5
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = 2000
			maxAmount = 2000
		}
	}

	MODULE:NEEDS[RP-0]
	{
		name = ModuleAvionics
		massLimit = 1.0
		interplanetary = False
	}

	%SetupKOS = 1964
}

