@PART[Auriga_Parachute_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True

	@rescaleFactor = 1.488
	@mass = 0.045
	%skinMaxTemp = 2000

	@title = LK-1 Capsule Parachute
	@manufacturer = #roMfrOKB52
	@description = Main parachute of the LK-1 capsule. Must be preceded by the drogue parachute when returning from lunar distances.

	@MODULE[ModuleParachute]:NEEDS[!RealChute]
	{
		@semiDeployedDrag = 10
		@fullyDeployedDrag = 1000
	}

	!MODULE[ModuleParachute]:NEEDS[RealChute] {}

	MODULE:NEEDS[RealChute]
	{
		name = RealChuteModule
		caseMass = 0.033
		timer = 0
		mustGoDown = true
		cutSpeed = 0.5
		spareChutes = 1
		invertCanopy = false
		reverseOrientation = true
		PARACHUTE
		{
			material = Nylon
			preDeployedDiameter = 5
			deployedDiameter = 23.74
			minIsPressure = false
			minPressure = 0.01
			minDeployment = 20000
			deploymentAlt = 3000
			preDeploymentSpeed = 2
			deploymentSpeed = 6
			preDeploymentAnimation = Auriga_Parachute_1_Semi
			deploymentAnimation = Auriga_Parachute_1_Full
			parachuteName = Canopy1
			capName = Cap1
		}
	}
}

