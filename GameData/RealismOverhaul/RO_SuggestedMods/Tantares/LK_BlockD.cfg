@PART[lk_v2_crew_s0p5_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True

	@rescaleFactor = 2.05
	@mass = 0.75
	%CoMOffset = 0.0, -0.5125, 0.0

	@title = LK Crew Cabin
	@manufacturer = #roMfrOKB1
	@description = Fly me to the Moon, comrade!

	@MODULE[ModuleCommand]
	{
		@minimumCrew = 1
		%RESOURCE[ElectricCharge]
		{
			%rate = 0.450
		}
	}

	!RESOURCE,*{}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
		impassablenodes = top, bottom
	}

	MODULE
	{
		name = ModuleFuelTanks
		volume = 150
		basemass = -1
		type = ServiceModule
		TANK
		{
			name = ElectricCharge
			amount = 43200
			maxAmount = 43200
		}
		TANK
		{
			name = Oxygen
			amount = 1890
			maxAmount = 1890
		}
		TANK
		{
			name = Food
			amount = 9
			maxAmount = 9
		}
		TANK
		{
			name = Water
			amount = 5.1
			maxAmount = 5.1
		}
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 300
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 4.5
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 8.1
		}
	}
}

@INTERNAL[lk_v2_crew_s0p5_1_interior]:BEFORE[RealismOverhaul]
{
	%scaleAll = 2.05, 2.05, 2.05
}

