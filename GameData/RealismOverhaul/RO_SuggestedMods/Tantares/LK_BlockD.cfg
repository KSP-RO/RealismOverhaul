@PART[lk_v2_low_gain_antenna_srf_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True

	@rescaleFactor = 2.05
	@mass = 0.01

	@title = LK Radio Antenna
	@manufacturer = #roMfrOKB1
	@description = Reach the Earth with it, but through orbiter

	@MODULE[ModuleDataTransmitter]:NEEDS[RealAntennas]
	{
		@name = ModuleRealAntenna
		%referenceGain = 1.5
	}
	MODULE:NEEDS[RemoteTech]
	{
		name = ModuleRTAntenna
		Mode0OmniRange = 0
		Mode1OmniRange = 8000000
		EnergyCost = 0.004
		TRANSMITTER
		{
			PacketInterval = 0.2
			PacketSize = 0.38
			PacketResourceCost = 0.02
		}
	}
}

