@PART[tantares_engine_rd_858_s0_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True

	@rescaleFactor = 1.64
	engineType = RD858

	@title = RD-858/RD-859
	@manufacturer = #roMfrKBYuzhnoye
	@description = LK landing engine. NOTE: main engine (RD-858) works as a usual engine, but reserve one (RD-859) is basically RCS

	!MODULE[ModuleEnginesFX]:HAS[#engineID[Backup]] {}
	!MODULE[ModuleWaterfallFX]:HAS[#moduleID[BackupFx]] {}

	@MODULE[ModuleRCSFX]
	{
		!resourceName = DELETE
		@thrusterPower = 10.0275
		@resourceFlowMode = STAGE_PRIORITY_FLOW
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = UDMH
			ratio = 0.498
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.502
		}
		@atmosphereCurve
		{
			@key,0 = 0 312
			@key,1 = 1 285
		}
	}
}

