		%maxThrust = 29.4
		%heatProduction = 100
		%ullage = False
		%pressureFed = True
		%ignitions = 5
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 0.5
		}
	}

	!MODULE[ModuleEngineConfigs] {}
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = RD-1987
		origMass = 0.15
		modded = false
		CONFIG
		{
			name = RD-1987
			minThrust = 14.7
			maxThrust = 29.4
			heatProduction = 100
			ullage = False
			pressureFed = True
			ignitions = 5
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			PROPELLANT
			{
				name = UDMH
				ratio = 0.4720
				DrawGauge = True
			}
			PROPELLANT
			{
				name = NTO
				ratio = 0.5280
			}
			atmosphereCurve
			{
				key = 0 325
				key = 1 270
			}
			massMult = 1.0
		}
	}
}

