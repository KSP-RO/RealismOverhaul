	@description = Pressure fed UDMH/NTO engine of the Mars ascent vehicle. Up to 5 ignitions.

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
		!PROPELLANT,* {}
		!atmosphereCurve {}
