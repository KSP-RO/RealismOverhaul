@PART[hamal_avionics_s1_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True

	@rescaleFactor = 1.76
	@mass = 1.3
	%maxTemp = 1073.15

	@title = Progress Pod
	@manufacturer = #roMfrRKKEnergia
	@description = Houses instrumentation for Progress supply crafts

	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0.06
		}
	}

	!RESOURCE,* {}

	MODULE
	{
		name = ModuleFuelTanks
		volume = 1577.404400668
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = Full
			maxAmount = 10000
		}
		TANK
		{
			name = NTO
			amount = Full
			maxAmount = 461
		}
		TANK
		{
			name = UDMH
			amount = Full
			maxAmount = 255
		}
		TANK
		{
			name = Oxygen
			amount = Full
			maxAmount = 170000
		}
	}

	MODULE:NEEDS[ConnectedLivingSpace]
	{
		name = ModuleConnectedLivingSpace
		passable = true
		impassablenodes = bottom
	}
}

@PART[hamal_avionics_s1_1]:NEEDS[RemoteTech]:FOR[RealismOverhaul]
{
	MODULE
	{
		name = ModuleSPU
	}

	MODULE
	{
		name = ModuleRTAntennaPassive
		TechRequired = start

		OmniRange = 2000000

		TRANSMITTER
		{
			PacketInterval = 0.4
			PacketSize = 0.27
			PacketResourceCost = 0.025
		}
	}
}

