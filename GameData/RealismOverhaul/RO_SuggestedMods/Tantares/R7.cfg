@PART[octans_les_s0_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True

	@rescaleFactor = 1.43
	@mass = 2.735

	@title = Soyuz Launch Escape System
	@manufacturer = NII-125
	@description = Launch escape tower for the Soyuz spacecraft. To boldly flee.

	!RESOURCE[SolidFuel]
	{
	}
	@MODULE[ModuleEngines*]
	{
		@minThrust = 745
		@maxThrust = 745
		@heatProduction = 100
		@PROPELLANT[SolidFuel]
		{
			@name = PBAA
			@ratio = 1.0
			%DrawGauge = True
		}
		@atmosphereCurve
		{
			@key,0 = 0 235
			@key,1 = 1 215
		}
		%ullage = False
		%pressureFed = False
		%ignitions = 1
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = Soyuz_LES
		modded = false
		CONFIG
		{
			name = Soyuz_LES
			minThrust = 745
			maxThrust = 745
			heatProduction = 100
			PROPELLANT
			{
				name = PBAA
				ratio = 1.0
				DrawGauge = True
			}
			atmosphereCurve
			{
				key = 0 235
				key = 1 215
			}
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		volume = 2753
		type = PBAA
		basemass = -1
		TANK
		{
			name = PBAA
			amount = 2753
			maxAmount = 2753
		}
	}
}
