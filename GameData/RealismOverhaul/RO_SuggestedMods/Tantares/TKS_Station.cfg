@PART[tantares_mpdt_s5_97_srf_1]:FOR[RealismOverhaul]
{
	%RSSROConfig = True

	@rescaleFactor = 1.61
	@mass = 0.25

	@title = S5.97 MPD Thruster
	@manufacturer = #roMfrNPOEnergia
	@description = Applied-field magnetoplasmadynamic thruster for the MEK electric tug. Runs on xenon and needs about 300 kW of electric power.

	@MODULE[ModuleEngines*]
	{
		%EngineType = Electric
		!PROPELLANT,* {}
		!atmosphereCurve {}
		%minThrust = 0.001683
		%maxThrust = 0.008413
		%heatProduction = 135000
		%ullage = False
		%ignitions = 0
		!IGNITOR_RESOURCE,* {}
	}

	!MODULE[ModuleEngineConfigs] {}
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = S5.97
		origMass = 0.25
		modded = false
		CONFIG
		{
			name = S5.97
			description = Efficiency 55%, 0.83 kg/kW.
			minThrust = 0.001683
			maxThrust = 0.008413
			heatProduction = 135000
			PROPELLANT
			{
				name = XenonGas
				ratio = 1.0
				DrawGauge = True
			}
			PROPELLANT
			{
				name = ElectricCharge
				ratio = 8239.18
				minResToLeave = 10.0
				DrawGauge = True
			}
			atmosphereCurve
			{
				key = 0 4000
				key = 1 1
			}
			massMult = 1.0
		}
	}
}

